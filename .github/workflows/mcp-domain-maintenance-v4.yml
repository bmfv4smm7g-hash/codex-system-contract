name: mcp-domain-maintenance-v4

on:
  push:
    branches:
      - contract/mcp/feat/tool-projection
    paths:
      - .github/workflows/mcp-domain-maintenance-v4.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire MCP projection without guardrail regressions
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          registry = Path('codex_wire_audit/source_registry.py')
          text = registry.read_text()
          helper_marker = '''\n\ndef from_legacy_maps(\n'''
          helper = '''\n\ndef _merge_optional_specs(\n    specs: list[SourceSpec],\n    rows: Iterable[tuple[str, str, str, tuple[str, ...]]],\n    *,\n    role: str,\n    extractor_id: str,\n) -> None:\n    positions = {spec.id: index for index, spec in enumerate(specs)}\n    for spec_id, legacy_key, path, symbols in rows:\n        index = positions.get(spec_id)\n        if index is None:\n            specs.append(SourceSpec(\n                id=spec_id,\n                legacy_key=legacy_key,\n                group=SourceGroup.EXTRA,\n                path_candidates=(path,),\n                required=False,\n                roles=(role,),\n                expected_symbols=tuple(symbols),\n                extractor_ids=(extractor_id,),\n            ))\n            positions[spec_id] = len(specs) - 1\n            continue\n        current = specs[index]\n        specs[index] = SourceSpec(\n            id=current.id,\n            legacy_key=current.legacy_key,\n            group=current.group,\n            path_candidates=current.path_candidates,\n            required=current.required,\n            roles=tuple(dict.fromkeys((*current.roles, role))),\n            expected_symbols=tuple(dict.fromkeys((*current.expected_symbols, *symbols))),\n            extractor_ids=tuple(sorted(set((*current.extractor_ids, extractor_id)))),\n            exclusion_reason=current.exclusion_reason,\n        )\n'''
          if '_merge_optional_specs(' not in text:
              if helper_marker not in text:
                  raise SystemExit('source registry helper marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          insert_before = '''    specs.append(SourceSpec(\n        id="source_spec.extra.generated_config_schema",'''
          block = '''    mcp_specs = (\n        ("source_spec.extra.mcp_catalog", "mcp_catalog", "codex-rs/codex-mcp/src/catalog.rs", ("McpServerSource", "McpCatalogBuilder", "ResolvedMcpCatalog")),\n        ("source_spec.extra.mcp_runtime", "mcp_runtime", "codex-rs/codex-mcp/src/mcp/mod.rs", ("McpConfig", "effective_mcp_servers", "ToolPluginProvenance")),\n        ("source_spec.extra.mcp_tools", "mcp_tools", "codex-rs/codex-mcp/src/tools.rs", ("ToolInfo", "ToolFilter", "normalize_tools_for_model_with_prefix")),\n        ("source_spec.extra.mcp_tool_exposure", "mcp_tool_exposure", "codex-rs/core/src/mcp_tool_exposure.rs", ("McpHandlerCache", "append_mcp_tools", "tool_is_model_visible")),\n        ("source_spec.extra.mcp_tool_plan", "mcp_tool_plan", "codex-rs/core/src/tools/spec_plan.rs", ("build_tool_router", "apply_mcp_tool_exposure_policy", "omit_tools_from")),\n        ("source_spec.extra.mcp_handler", "mcp_handler", "codex-rs/core/src/tools/handlers/mcp.rs", ("McpHandler", "prepare_mcp_call", "handle_mcp_tool_call")),\n    )\n'''
          if 'mcp_specs = (' not in text:
              if insert_before not in text:
                  raise SystemExit('source registry insertion marker missing')
              text = text.replace(insert_before, block + insert_before, 1)

          append_marker = '''    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    return SourceRegistry(specs)'''
          append_replacement = '''    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    _merge_optional_specs(\n        specs,\n        mcp_specs,\n        role="mcp_projection",\n        extractor_id="extractor.mcp_projection",\n    )\n    return SourceRegistry(specs)'''
          if 'role="mcp_projection"' not in text:
              if append_marker not in text:
                  raise SystemExit('source registry append marker missing')
              text = text.replace(append_marker, append_replacement, 1)
          registry.write_text(text)

          init = Path('codex_wire_audit/extractors/__init__.py')
          init.write_text('''"""Canonical extractor registry and deterministic built-in activation."""\n\nfrom importlib import import_module\n\nfrom .registry import Extractor, ExtractorResult, create_extractors, register_extractor\n\n_BUILTIN_MODULES = (\n    "turn_metadata",\n    "context_management",\n    "config_effects",\n    "local_storage",\n    "prompt_context",\n    "execution_policy",\n    "plugin_runtime",\n    "execution_environment",\n    "routing_transport",\n    "mcp_projection",\n)\nfor _module_name in _BUILTIN_MODULES:\n    import_module(f"{__name__}.{_module_name}")\ndel _module_name\n\n__all__ = [\n    "Extractor",\n    "ExtractorResult",\n    "create_extractors",\n    "register_extractor",\n]\n''')

          profiles_path = Path('codex_wire_audit/coverage_profiles.v3.json')
          doc = json.loads(profiles_path.read_text())
          by_id = {row['id']: row for row in doc['profiles']}
          hybrid = by_id['hybrid_v19']
          if 'extractor.mcp_projection' not in hybrid['required_extractors']:
              hybrid['required_extractors'].append('extractor.mcp_projection')
          hybrid['description'] = (
              'Transition profile: canonical generated config schema, config-to-surface graph, turn metadata, '
              'context management, prompt/context composition, execution authority, plugin runtime capabilities, '
              'execution-environment context, routing/proxy transport, and MCP tool projection; remaining protocol '
              'families may still use the frozen legacy adapter.'
          )
          profiles_path.write_text(json.dumps(doc, indent=2) + '\n')

          release_path = Path('codex_wire_audit/release_spec.v1.json')
          release = json.loads(release_path.read_text())
          claims = release['capability_claims']
          if not any(row['id'] == 'mcp_projection' for row in claims):
              claim = {
                  'extractor_ids': ['extractor.mcp_projection'],
                  'id': 'mcp_projection',
                  'profile_assertions': {
                      'codex_wire_full': {'required_extractors_contains': ['extractor.mcp_projection']},
                      'hybrid_v19': {'required_extractors_contains': ['extractor.mcp_projection']},
                      'mcp_only': {'required_extractors_contains': ['extractor.mcp_projection']},
                  },
                  'required_resources': [
                      'extractors/mcp_projection.py',
                      'proof_schema_templates/mcp-projection-semantics-v1.schema.json',
                      'coverage_profiles.v3.json',
                  ],
                  'status': 'active_package',
              }
              claims.insert(next(i for i, row in enumerate(claims) if row['id'] == 'canonical_system_contract'), claim)
          canonical = next(row for row in claims if row['id'] == 'canonical_system_contract')
          required = canonical['profile_assertions']['hybrid_v19']['required_extractors_contains']
          if 'extractor.mcp_projection' not in required:
              required.append('extractor.mcp_projection')
          release_path.write_text(json.dumps(release, indent=2) + '\n')
          PY
          python -m pytest -q tests/test_mcp_projection_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
      - name: Commit deterministic MCP outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(mcp): wire projection and refresh deterministic evidence'
          git push origin HEAD:contract/mcp/feat/tool-projection
