name: debug-pinned-diagnostics

on:
  workflow_dispatch:
  push:
    branches: [fix/metadata-projection-release]
    paths:
      - ".github/workflows/debug-pinned-diagnostics.yml"

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/metadata-projection-release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Generate report without fail policy and print diagnostics
        working-directory: toolchain
        run: |
          set -euo pipefail
          codex="$RUNNER_TEMP/codex-source"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          codex-wire-audit --json --repo-root "$codex" --coverage-profile hybrid_v19 \
            --fail-on never --fail-on-semantic-change never \
            --output "$RUNNER_TEMP/report.json"
          python - "$RUNNER_TEMP/report.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          diagnostics = [
              item for item in report.get("diagnostics", [])
              if item.get("severity") in {"warning", "error"}
          ]
          print(json.dumps(diagnostics, indent=2, sort_keys=True))
          print(f"diagnostic_count={len(diagnostics)}")
          print(f"error_count={sum(item.get('severity') == 'error' for item in diagnostics)}")
          PY
