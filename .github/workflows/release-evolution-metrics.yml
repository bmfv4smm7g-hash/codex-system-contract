name: release-evolution-metrics

on:
  push:
    branches:
      - release/evolution/feat/exact-codex
    paths:
      - .github/workflows/release-evolution-metrics.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate deterministic maintainability assets
        working-directory: toolchain
        run: python tools/maintainability_metrics.py --write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evolution-maintainability
          path: |
            toolchain/codex_wire_audit_v19_maintainability_metrics.json
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          if-no-files-found: error
          retention-days: 2
