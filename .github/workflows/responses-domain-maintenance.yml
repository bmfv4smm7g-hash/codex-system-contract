name: responses-domain-maintenance

on:
  push:
    branches:
      - contract/responses/feat/request-events
    paths:
      - .github/workflows/responses-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire native Responses domain
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          registry = Path('codex_wire_audit/source_registry.py')
          text = registry.read_text()
          local_mcp = '''    mcp_specs = (\n        ("source_spec.extra.mcp_catalog", "mcp_catalog", "codex-rs/codex-mcp/src/catalog.rs", ("McpServerSource", "McpCatalogBuilder", "ResolvedMcpCatalog")),\n        ("source_spec.extra.mcp_runtime", "mcp_runtime", "codex-rs/codex-mcp/src/mcp/mod.rs", ("McpConfig", "effective_mcp_servers", "ToolPluginProvenance")),\n        ("source_spec.extra.mcp_tools", "mcp_tools", "codex-rs/codex-mcp/src/tools.rs", ("ToolInfo", "ToolFilter", "normalize_tools_for_model_with_prefix")),\n        ("source_spec.extra.mcp_tool_exposure", "mcp_tool_exposure", "codex-rs/core/src/mcp_tool_exposure.rs", ("McpHandlerCache", "append_mcp_tools", "tool_is_model_visible")),\n        ("source_spec.extra.mcp_tool_plan", "mcp_tool_plan", "codex-rs/core/src/tools/spec_plan.rs", ("build_tool_router", "apply_mcp_tool_exposure_policy", "omit_tools_from")),\n        ("source_spec.extra.mcp_handler", "mcp_handler", "codex-rs/core/src/tools/handlers/mcp.rs", ("McpHandler", "prepare_mcp_call", "handle_mcp_tool_call")),\n    )\n'''
          if local_mcp not in text:
              raise SystemExit('local MCP source-spec block missing')
          text = text.replace(local_mcp, '', 1)

          helper_marker = '\n\ndef from_legacy_maps(\n'
          module_block = '''\n\n_MCP_SPECS = (\n    ("source_spec.extra.mcp_catalog", "mcp_catalog", "codex-rs/codex-mcp/src/catalog.rs", ("McpServerSource", "McpCatalogBuilder", "ResolvedMcpCatalog")),\n    ("source_spec.extra.mcp_runtime", "mcp_runtime", "codex-rs/codex-mcp/src/mcp/mod.rs", ("McpConfig", "effective_mcp_servers", "ToolPluginProvenance")),\n    ("source_spec.extra.mcp_tools", "mcp_tools", "codex-rs/codex-mcp/src/tools.rs", ("ToolInfo", "ToolFilter", "normalize_tools_for_model_with_prefix")),\n    ("source_spec.extra.mcp_tool_exposure", "mcp_tool_exposure", "codex-rs/core/src/mcp_tool_exposure.rs", ("McpHandlerCache", "append_mcp_tools", "tool_is_model_visible")),\n    ("source_spec.extra.mcp_tool_plan", "mcp_tool_plan", "codex-rs/core/src/tools/spec_plan.rs", ("build_tool_router", "apply_mcp_tool_exposure_policy", "omit_tools_from")),\n    ("source_spec.extra.mcp_handler", "mcp_handler", "codex-rs/core/src/tools/handlers/mcp.rs", ("McpHandler", "prepare_mcp_call", "handle_mcp_tool_call")),\n)\n\n_RESPONSES_REQUEST_SPECS = (\n    ("source_spec.base.common", "common", "codex-rs/codex-api/src/common.rs", ("ResponsesApiRequest", "ResponseCreateWsRequest", "ResponsesWsRequest")),\n    ("source_spec.base.core", "core", "codex-rs/core/src/client.rs", ("build_responses_request", "responses_request_properties_match", "build_ws_client_metadata")),\n    ("source_spec.base.http", "http", "codex-rs/codex-api/src/endpoint/responses.rs", ("ResponsesEndpoint", "ResponsesClient", "stream_request")),\n    ("source_spec.base.ws", "ws", "codex-rs/codex-api/src/endpoint/responses_websocket.rs", ("ResponsesWebsocketConnection", "ResponsesWebsocketClient", "stream_request")),\n)\n\n_RESPONSES_LITE_SPECS = (\n    ("source_spec.base.core", "core", "codex-rs/core/src/client.rs", ("use_responses_lite", "ResponseItem::AdditionalTools", "add_responses_lite_header")),\n)\n\n_RESPONSE_EVENT_SPECS = (\n    ("source_spec.base.common", "common", "codex-rs/codex-api/src/common.rs", ("ResponseEvent",)),\n    ("source_spec.base.response_sse", "response_sse", "codex-rs/codex-api/src/sse/responses.rs", ("ResponsesStreamEvent", "process_responses_event", "spawn_response_stream")),\n    ("source_spec.base.ws", "ws", "codex-rs/codex-api/src/endpoint/responses_websocket.rs", ("process_responses_event", "run_websocket_response_stream")),\n)\n\ndef _merge_protocol_domain_specs(specs: list[SourceSpec]) -> None:\n    for rows, role, extractor_id in (\n        (_MCP_SPECS, "mcp_projection", "extractor.mcp_projection"),\n        (_RESPONSES_REQUEST_SPECS, "responses_request", "extractor.responses_request"),\n        (_RESPONSES_LITE_SPECS, "responses_lite", "extractor.responses_lite"),\n        (_RESPONSE_EVENT_SPECS, "response_events", "extractor.response_events"),\n    ):\n        _merge_optional_specs(specs, rows, role=role, extractor_id=extractor_id)\n'''
          if '_RESPONSES_REQUEST_SPECS = (' not in text:
              if helper_marker not in text:
                  raise SystemExit('source registry helper insertion marker missing')
              text = text.replace(helper_marker, module_block + helper_marker, 1)

          append_marker = '''    _merge_optional_specs(\n        specs,\n        mcp_specs,\n        role="mcp_projection",\n        extractor_id="extractor.mcp_projection",\n    )\n    return SourceRegistry(specs)'''
          append_replacement = '''    _merge_protocol_domain_specs(specs)\n    return SourceRegistry(specs)'''
          if append_marker not in text:
              raise SystemExit('source registry MCP append marker missing')
          text = text.replace(append_marker, append_replacement, 1)
          registry.write_text(text)

          init = Path('codex_wire_audit/extractors/__init__.py')
          text = init.read_text()
          if '"responses_protocol"' not in text:
              marker = '    "mcp_projection",\n)'
              if marker not in text:
                  raise SystemExit('extractor activation marker missing')
              text = text.replace(marker, '    "mcp_projection",\n    "responses_protocol",\n)', 1)
          init.write_text(text)

          profiles_path = Path('codex_wire_audit/coverage_profiles.v3.json')
          doc = json.loads(profiles_path.read_text())
          by_id = {row['id']: row for row in doc['profiles']}
          responses_ids = [
              'extractor.responses_request',
              'extractor.responses_lite',
              'extractor.response_events',
          ]
          for profile_id in ('responses_only', 'codex_wire_full'):
              missing = [value for value in responses_ids if value not in by_id[profile_id]['required_extractors']]
              if missing:
                  raise SystemExit(f'{profile_id} lost declared Responses extractors: {missing}')
          hybrid = by_id['hybrid_v19']
          for extractor_id in responses_ids:
              if extractor_id not in hybrid['required_extractors']:
                  hybrid['required_extractors'].append(extractor_id)
          hybrid['description'] = (
              'Transition profile: canonical generated config schema, config-to-surface graph, turn metadata, '
              'context management, prompt/context composition, execution authority, plugin runtime capabilities, '
              'execution-environment context, routing/proxy transport, MCP tool projection, and Responses request/Lite/event semantics; '
              'remaining protocol families may still use the frozen legacy adapter.'
          )
          profiles_path.write_text(json.dumps(doc, indent=2) + '\n')

          release_path = Path('codex_wire_audit/release_spec.v1.json')
          release = json.loads(release_path.read_text())
          claims = release['capability_claims']
          if not any(row['id'] == 'responses_protocol' for row in claims):
              claim = {
                  'extractor_ids': responses_ids,
                  'id': 'responses_protocol',
                  'profile_assertions': {
                      'codex_wire_full': {'required_extractors_contains': responses_ids},
                      'hybrid_v19': {'required_extractors_contains': responses_ids},
                      'responses_only': {'required_extractors_contains': responses_ids},
                  },
                  'required_resources': [
                      'extractors/responses_protocol.py',
                      'proof_schema_templates/responses-request-semantics-v1.schema.json',
                      'proof_schema_templates/responses-lite-semantics-v1.schema.json',
                      'proof_schema_templates/response-events-semantics-v1.schema.json',
                      'coverage_profiles.v3.json',
                  ],
                  'status': 'active_package',
              }
              claims.insert(next(i for i, row in enumerate(claims) if row['id'] == 'canonical_system_contract'), claim)
          canonical = next(row for row in claims if row['id'] == 'canonical_system_contract')
          required = canonical['profile_assertions']['hybrid_v19']['required_extractors_contains']
          for extractor_id in responses_ids:
              if extractor_id not in required:
                  required.append(extractor_id)
          release_path.write_text(json.dumps(release, indent=2) + '\n')
          PY
          python -m pytest -q tests/test_responses_protocol_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
      - name: Commit deterministic Responses outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(responses): wire protocol and refresh deterministic evidence'
          git push origin HEAD:contract/responses/feat/request-events
