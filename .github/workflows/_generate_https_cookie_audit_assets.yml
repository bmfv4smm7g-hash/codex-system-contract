name: Generate HTTPS cookie audit assets

on:
  push:
    branches:
      - fix/https-set-cookie-diagnostics

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/https-set-cookie-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install toolchain
        working-directory: toolchain
        run: python -m pip install -e ".[test]"
      - name: Compile and run focused regression tests
        working-directory: toolchain
        run: |
          python -m compileall -q codex_wire_audit tests
          python -m pytest -q tests/test_responses_protocol_extractor.py
      - name: Regenerate deterministic assets
        working-directory: toolchain
        run: |
          python tools/build_v11_assets.py
          python tools/maintainability_metrics.py --write
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/codex_wire_audit_v11_schemas toolchain/codex_wire_audit_v11_examples             toolchain/codex_wire_audit_v19_maintainability_metrics.json             toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate audit assets"
          git push origin HEAD:fix/https-set-cookie-diagnostics
