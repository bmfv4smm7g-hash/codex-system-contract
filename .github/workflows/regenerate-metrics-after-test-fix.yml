name: regenerate-metrics-after-test-fix

on:
  workflow_dispatch:
  push:
    branches: [fix/metadata-projection-release]
    paths:
      - ".github/workflows/regenerate-metrics-after-test-fix.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/metadata-projection-release
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Regenerate committed maintainability assets
        working-directory: toolchain
        run: python tools/maintainability_metrics.py --write
      - name: Commit regenerated assets
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md; then
            echo "Maintainability assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git commit -m "chore: regenerate maintainability assets"
          git push origin HEAD:fix/metadata-projection-release
