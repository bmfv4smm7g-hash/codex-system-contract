name: routing-domain-maintenance

on:
  push:
    branches:
      - contract/routing/feat/proxy-network
    paths:
      - .github/workflows/routing-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire routing domain
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          registry = Path('codex_wire_audit/source_registry.py')
          text = registry.read_text()
          insert_before = '''    specs.append(SourceSpec(\n        id="source_spec.extra.generated_config_schema",'''
          routing_block = '''    routing_specs = (\n        ("source_spec.extra.routing_proxy_spec", "routing_proxy_spec", "codex-rs/core/src/config/network_proxy_spec.rs", ("NetworkProxySpec", "start_proxy", "environment_policy")),\n        ("source_spec.extra.routing_proxy_config", "routing_proxy_config", "codex-rs/network-proxy/src/config.rs", ("NetworkProxyConfig", "NetworkMode", "resolve_runtime")),\n        ("source_spec.extra.routing_requirements", "routing_requirements", "codex-rs/config/src/config_requirements.rs", ("NetworkRequirementsToml", "managed_allowed_domains_only", "header_injections")),\n        ("source_spec.extra.routing_outbound_proxy", "routing_outbound_proxy", "codex-rs/http-client/src/outbound_proxy.rs", ("OutboundProxyPolicy", "HttpClientFactory", "resolve_proxy_route")),\n    )\n'''
          if 'routing_specs = (' not in text:
              if insert_before not in text:
                  raise SystemExit('source registry insertion marker missing')
              text = text.replace(insert_before, routing_block + insert_before, 1)
          append_marker = '''    _append_optional_specs(\n        specs,\n        environment_specs,\n        role="execution_environment",\n        extractor_id="extractor.execution_environment",\n    )\n    return SourceRegistry(specs)'''
          append_replacement = '''    _append_optional_specs(\n        specs,\n        environment_specs,\n        role="execution_environment",\n        extractor_id="extractor.execution_environment",\n    )\n    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    return SourceRegistry(specs)'''
          if 'extractor.routing_transport' not in text:
              if append_marker not in text:
                  raise SystemExit('source registry append marker missing')
              text = text.replace(append_marker, append_replacement, 1)
          registry.write_text(text)

          init = Path('codex_wire_audit/extractors/__init__.py')
          text = init.read_text()
          marker = 'from . import execution_environment as _execution_environment  # noqa: E402,F401\n'
          addition = marker + 'from . import routing_transport as _routing_transport  # noqa: E402,F401\n'
          if '_routing_transport' not in text:
              if marker not in text:
                  raise SystemExit('extractor import marker missing')
              text = text.replace(marker, addition, 1)
          init.write_text(text)

          profiles_path = Path('codex_wire_audit/coverage_profiles.v3.json')
          profiles_doc = json.loads(profiles_path.read_text())
          profiles = profiles_doc['profiles']
          by_id = {row['id']: row for row in profiles}
          for profile_id in ('hybrid_v19', 'codex_wire_full'):
              values = by_id[profile_id]['required_extractors']
              if 'extractor.routing_transport' not in values:
                  values.append('extractor.routing_transport')
          by_id['hybrid_v19']['description'] = (
              'Transition profile: canonical generated config schema, config-to-surface graph, '
              'turn metadata, context management, prompt/context composition, execution authority, '
              'plugin runtime capabilities, execution-environment context, and routing/proxy transport; '
              'remaining protocol families may still use the frozen legacy adapter.'
          )
          by_id['codex_wire_full']['description'] = (
              'Repository-wide canonical wire, local-storage, prompt-context, execution-policy, '
              'plugin-runtime, execution-environment, and routing/proxy proof. Legacy reconstruction '
              'cannot satisfy it, and historical metadata transitions and runtime conformance are part '
              'of the proof surface.'
          )
          if 'routing_transport_only' not in by_id:
              focused = {
                  'allow_legacy_reconstruction': False,
                  'description': 'Focused source-derived routing/proxy proof without claiming permission authority, environment construction, provider protocol semantics, or plugin/MCP capabilities.',
                  'id': 'routing_transport_only',
                  'required_dimensions': ['schema', 'profile', 'provenance'],
                  'required_extractors': ['extractor.routing_transport'],
                  'required_history_keys': [],
                  'required_runtime_scenarios': [],
                  'version': '1.0.0',
              }
              fixture_index = next(i for i, row in enumerate(profiles) if row['id'] == 'fixture')
              profiles.insert(fixture_index, focused)
          profiles_path.write_text(json.dumps(profiles_doc, indent=2) + '\n')

          release_path = Path('codex_wire_audit/release_spec.v1.json')
          release = json.loads(release_path.read_text())
          claims = release['capability_claims']
          if not any(row['id'] == 'routing_transport' for row in claims):
              claim = {
                  'extractor_ids': ['extractor.routing_transport'],
                  'id': 'routing_transport',
                  'profile_assertions': {
                      'codex_wire_full': {'required_extractors_contains': ['extractor.routing_transport']},
                      'hybrid_v19': {'required_extractors_contains': ['extractor.routing_transport']},
                      'routing_transport_only': {'required_extractors_contains': ['extractor.routing_transport']},
                  },
                  'required_resources': [
                      'extractors/routing_transport.py',
                      'proof_schema_templates/routing-transport-semantics-v1.schema.json',
                      'coverage_profiles.v3.json',
                  ],
                  'status': 'active_package',
              }
              idx = next(i for i, row in enumerate(claims) if row['id'] == 'canonical_system_contract')
              claims.insert(idx, claim)
          canonical = next(row for row in claims if row['id'] == 'canonical_system_contract')
          required = canonical['profile_assertions']['hybrid_v19']['required_extractors_contains']
          if 'extractor.routing_transport' not in required:
              required.append('extractor.routing_transport')
          release_path.write_text(json.dumps(release, indent=2) + '\n')
          PY
          python -m pytest -q tests/test_routing_transport_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
      - name: Commit deterministic routing outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(routing): refresh registry and package evidence'
          git push origin HEAD:contract/routing/feat/proxy-network
