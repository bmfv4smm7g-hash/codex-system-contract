name: generate-cookie-contract-assets

on:
  push:
    branches:
      - fix/responses-websocket-cookie-affinity
    paths:
      - "toolchain/**"
      - ".github/workflows/_generate_cookie_contract_assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/responses-websocket-cookie-affinity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Run focused cookie contract tests
        working-directory: toolchain
        run: python -m pytest -q tests/test_responses_protocol_extractor.py
      - name: Regenerate deterministic assets
        working-directory: toolchain
        run: |
          python tools/build_v11_assets.py
          python tools/maintainability_metrics.py --write
      - name: Commit regenerated assets
        run: |
          if git diff --quiet; then
            echo "generated assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/codex_wire_audit_v11_examples toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md toolchain/codex_wire_audit_v19_maintainability_metrics.json
          git commit -m "chore: regenerate cookie contract assets"
          git push origin HEAD:fix/responses-websocket-cookie-affinity
