name: config-metrics-refresh

on:
  push:
    branches:
      - contract/config/feat/native-effect-closure
    paths:
      - .github/workflows/config-metrics-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Refresh and verify deterministic metrics
        working-directory: toolchain
        run: |
          set -euo pipefail
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit deterministic metrics
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- toolchain/codex_wire_audit_v19_maintainability_metrics.json toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(config): refresh maintainability metrics'
          git push origin HEAD:contract/config/feat/native-effect-closure
