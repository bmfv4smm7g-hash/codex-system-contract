name: config-native-effect-closure

on:
  push:
    branches:
      - contract/config/feat/native-effect-closure
    paths:
      - .github/workflows/config-native-effect-closure.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Close canonical config effect graph
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path

          specs = Path('codex_wire_audit/config_effect_specs.py')
          specs.write_text('''\"\"\"Declarative, source-bound links from user configuration to canonical surfaces.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Iterable\n\n\n@dataclass(frozen=True, slots=True)\nclass ConfigEffectSpec:\n    id: str\n    config_paths: tuple[str, ...]\n    target_id: str\n    relation: str\n    behavior: str\n    proof_tier: str = \"canonical_source_link\"\n    condition: str | None = None\n    legacy_setting: str | None = None\n    source_checks: tuple[tuple[str, str], ...] = ()\n\n\n# Frozen v10 compatibility settings. The v10 implementation remains immutable;\n# this tuple is only a parity oracle proving that the canonical graph no longer\n# needs to consume its wire_affecting_settings output.\n_FROZEN_V10_SETTINGS = (\n    \"model\",\n    \"model_provider\",\n    \"model_reasoning_effort\",\n    \"model_reasoning_summary\",\n    \"model_verbosity\",\n    \"service_tier\",\n    \"web_search\",\n    \"responses_api_metadata\",\n    \"mcp_servers\",\n    \"mcp_oauth_credentials_store\",\n    \"mcp_oauth_callback_port\",\n    \"mcp_oauth_callback_url\",\n    \"mcp_optional_startup_grace_ms\",\n    \"apps_mcp_product_sku\",\n    \"chatgpt_base_url\",\n    \"openai_base_url\",\n    \"orchestrator\",\n)\n\n\ndef _s(\n    id: str,\n    paths: tuple[str, ...],\n    target: str,\n    relation: str,\n    behavior: str,\n    *,\n    legacy: str | None = None,\n    condition: str | None = None,\n    checks: tuple[tuple[str, str], ...] = (),\n) -> ConfigEffectSpec:\n    return ConfigEffectSpec(\n        id=id,\n        config_paths=paths,\n        target_id=target,\n        relation=relation,\n        behavior=behavior,\n        condition=condition,\n        legacy_setting=legacy,\n        source_checks=checks,\n    )\n\n\n_SPECS = (\n    _s(\"effect.model\", (\"model\",), \"surface.responses.body.model\", \"selects\", \"Selects the model slug serialized into Responses requests.\", legacy=\"model\"),\n    _s(\"effect.model.routing_hint\", (\"model\",), \"surface.routing.hint.model\", \"projects_to\", \"Projects model identity into first-party Codex routing hints.\", legacy=\"model\"),\n    _s(\"effect.model.prompt_cache\", (\"model\",), \"surface.responses.prompt_cache_key\", \"participates_in\", \"Participates indirectly in request/cache identity.\", legacy=\"model\"),\n    _s(\"effect.model_provider\", (\"model_provider\",), \"surface.provider.selection\", \"selects\", \"Selects the model provider and endpoint/API plane.\", legacy=\"model_provider\"),\n    _s(\"effect.model_provider.headers\", (\"model_provider\",), \"surface.provider.headers\", \"selects\", \"Selects provider authentication and default header layers.\", legacy=\"model_provider\"),\n    _s(\"effect.model_provider.capabilities\", (\"model_provider\",), \"surface.provider.capabilities\", \"bounds\", \"Provider capabilities bound tools, WebSockets, hosted search/image behavior, and remote compaction.\", legacy=\"model_provider\"),\n    _s(\"effect.reasoning_effort\", (\"model_reasoning_effort\",), \"surface.responses.body.reasoning.effort\", \"projects_to\", \"Controls normalized reasoning effort.\", legacy=\"model_reasoning_effort\"),\n    _s(\"effect.reasoning_summary\", (\"model_reasoning_summary\",), \"surface.responses.body.reasoning.summary\", \"projects_to\", \"Controls reasoning-summary request policy.\", legacy=\"model_reasoning_summary\"),\n    _s(\"effect.reasoning_summary.delivery\", (\"model_reasoning_summary\",), \"surface.responses.body.stream_options.reasoning_summary_delivery\", \"projects_to\", \"Can request sequential cutoff delivery.\", legacy=\"model_reasoning_summary\", condition=\"ConcurrentReasoningSummaries enabled\"),\n    _s(\"effect.verbosity\", (\"model_verbosity\",), \"surface.responses.body.text.verbosity\", \"projects_to\", \"Controls Responses text verbosity when supported by the model.\", legacy=\"model_verbosity\"),\n    _s(\"effect.service_tier\", (\"service_tier\",), \"surface.responses.body.service_tier\", \"projects_to\", \"Selects the requested service tier after support/default filtering.\", legacy=\"service_tier\"),\n    _s(\"effect.service_tier.routing_hint\", (\"service_tier\",), \"surface.routing.hint.tier\", \"projects_to\", \"Projects service tier into first-party Codex routing hints.\", legacy=\"service_tier\"),\n    _s(\"effect.web_search\", (\"web_search\",), \"surface.tool.web_search\", \"controls_exposure\", \"Controls hosted web-search exposure in full Responses.\", legacy=\"web_search\"),\n    _s(\"effect.web_search.responses_lite\", (\"web_search\",), \"surface.responses_lite.hosted_tools\", \"suppressed_by\", \"Hosted model tools are omitted under Responses Lite.\", legacy=\"web_search\", condition=\"model uses Responses Lite\"),\n    _s(\"effect.responses_metadata\", (\"responses_api_metadata\", \"responses_api_metadata.*\"), \"surface.turn_metadata.extra\", \"merges_into\", \"Validated product metadata is flattened into canonical nested turn metadata.\", legacy=\"responses_api_metadata\"),\n    _s(\"effect.responses_metadata.precedence\", (\"responses_api_metadata\", \"responses_api_metadata.*\"), \"surface.turn_metadata.extra_precedence\", \"overrides\", \"Configured metadata overrides duplicate app-server responsesapiClientMetadata keys at merge time.\", legacy=\"responses_api_metadata\"),\n    _s(\"effect.mcp_servers\", (\"mcp_servers\", \"mcp_servers.*\"), \"surface.mcp.registry\", \"defines\", \"Defines MCP server registrations and runtime lifecycle inputs.\", legacy=\"mcp_servers\"),\n    _s(\"effect.mcp_servers.transport\", (\"mcp_servers\", \"mcp_servers.*\"), \"surface.mcp.transport\", \"configures\", \"Defines stdio or Streamable HTTP MCP transport.\", legacy=\"mcp_servers\"),\n    _s(\"effect.mcp_servers.model_tools\", (\"mcp_servers\", \"mcp_servers.*\"), \"surface.mcp.model_tools\", \"controls_exposure\", \"Server filters and runtime state control which MCP tools become model-visible.\", legacy=\"mcp_servers\"),\n    _s(\"effect.mcp_servers.turn_metadata\", (\"mcp_servers\", \"mcp_servers.*\"), \"surface.turn_metadata.tool_namespaces_info\", \"contributes_to\", \"Effective MCP namespaces/functions can be recorded in turn metadata.\", legacy=\"mcp_servers\", condition=\"Responses Lite plus turn_metadata_includes_tool_info\"),\n    _s(\"effect.mcp_oauth.credentials_store\", (\"mcp_oauth_credentials_store\",), \"surface.mcp.oauth.credentials_store\", \"selects\", \"Selects the resolved MCP OAuth credential-store mode.\", legacy=\"mcp_oauth_credentials_store\", checks=((\"config_toml\", \"pub mcp_oauth_credentials_store:\"), (\"core_config\", \"resolve_mcp_oauth_credentials_store_mode(\"))),\n    _s(\"effect.mcp_oauth.callback_port\", (\"mcp_oauth_callback_port\",), \"surface.mcp.oauth.callback_port\", \"configures\", \"Configures the local OAuth callback listener port; otherwise the OS chooses an ephemeral port.\", legacy=\"mcp_oauth_callback_port\", checks=((\"config_toml\", \"pub mcp_oauth_callback_port:\"), (\"core_config\", \"mcp_oauth_callback_port: cfg.mcp_oauth_callback_port\"))),\n    _s(\"effect.mcp_oauth.callback_url\", (\"mcp_oauth_callback_url\",), \"surface.mcp.oauth.callback_url\", \"configures\", \"Selects the OAuth authorization redirect URI while the local callback listener remains loopback-bound.\", legacy=\"mcp_oauth_callback_url\", checks=((\"config_toml\", \"pub mcp_oauth_callback_url:\"), (\"core_config\", \"mcp_oauth_callback_url: cfg.mcp_oauth_callback_url.clone()\"))),\n    _s(\"effect.mcp.startup_grace\", (\"mcp_optional_startup_grace_ms\",), \"surface.mcp.startup.optional_grace\", \"bounds\", \"Sets shared optional-server startup grace, falling back to the compiled default.\", legacy=\"mcp_optional_startup_grace_ms\", checks=((\"config_toml\", \"pub mcp_optional_startup_grace_ms:\"), (\"core_config\", \"DEFAULT_OPTIONAL_MCP_STARTUP_GRACE\"))),\n    _s(\"effect.mcp.apps_product_sku\", (\"apps_mcp_product_sku\",), \"surface.mcp.apps.product_sku\", \"projects_to\", \"Forwards the configured product SKU into the host-owned Codex Apps MCP runtime.\", legacy=\"apps_mcp_product_sku\", checks=((\"config_toml\", \"pub apps_mcp_product_sku:\"), (\"core_config\", \"apps_mcp_product_sku: cfg.apps_mcp_product_sku.clone()\"))),\n    _s(\"effect.chatgpt_base\", (\"chatgpt_base_url\",), \"surface.routing.chatgpt_auxiliary\", \"routes\", \"Selects the ChatGPT auxiliary backend authority.\", legacy=\"chatgpt_base_url\"),\n    _s(\"effect.chatgpt_base.apps_mcp\", (\"chatgpt_base_url\",), \"surface.mcp.apps.ps_route\", \"routes\", \"Forms the host-owned Codex Apps MCP backend route.\", legacy=\"chatgpt_base_url\"),\n    _s(\"effect.openai_base\", (\"openai_base_url\",), \"surface.routing.model_provider\", \"routes\", \"Overrides the built-in OpenAI-compatible provider authority.\", legacy=\"openai_base_url\"),\n    _s(\"effect.orchestrator.skills\", (\"orchestrator.skills.enabled\",), \"surface.orchestrator.skills_enabled\", \"controls_exposure\", \"Controls whether orchestrator-owned skills are exposed to the model; missing enabled defaults true.\", legacy=\"orchestrator\", checks=((\"config_toml\", \"pub orchestrator: Option<OrchestratorToml>\"), (\"core_config\", \"orchestrator_skills_enabled\"), (\"core_config\", \"resolve_orchestrator_feature_enabled\"))),\n    _s(\"effect.orchestrator.mcp\", (\"orchestrator.mcp.enabled\",), \"surface.orchestrator.mcp_enabled\", \"controls_exposure\", \"Controls whether orchestrator-owned MCP tools are exposed to the model; missing enabled defaults true.\", legacy=\"orchestrator\", checks=((\"core_config\", \"orchestrator_mcp_enabled\"),)),\n    _s(\"effect.provider_base\", (\"model_providers.*.base_url\",), \"surface.routing.model_provider\", \"routes\", \"Defines a configured provider's API authority.\"),\n    _s(\"effect.provider_auth\", (\"model_providers.*.env_key\", \"model_providers.*.experimental_bearer_token\", \"model_providers.*.auth\", \"model_providers.*.aws\"), \"surface.provider.credentials\", \"configures\", \"Configures provider-owned credentials and disables official experimental-context activation.\"),\n    _s(\"effect.provider_openai_auth\", (\"model_providers.*.requires_openai_auth\",), \"surface.provider.openai_auth_requirement\", \"configures\", \"Controls whether the provider consumes Codex-managed OpenAI/ChatGPT authentication.\"),\n    _s(\"effect.context_management\", (\"features.context_management\", \"features.context_management.experimental_mode\"), \"surface.context_management.activation\", \"requests_enablement\", \"Requests experimental no-summary context management; account/provider/model gates still apply.\"),\n    _s(\"effect.token_budget\", (\"features.token_budget\", \"features.token_budget.enabled\"), \"surface.context_management.rollover\", \"enables\", \"Enables token-budget context metadata and fresh-window rollover mechanics.\"),\n    _s(\"effect.history_notes\", (\"features.token_budget.use_history_notes_extension\",), \"surface.context_management.history_notes\", \"enables\", \"Exposes remote History/Notes tools and the thread-hint contributor.\"),\n    _s(\"effect.tool_metadata\", (\"features.tool_registry.turn_metadata_includes_tool_info\",), \"surface.turn_metadata.tool_namespaces_info\", \"enables\", \"Includes authoritative tool namespace/function information in per-turn metadata when applicable.\"),\n)\n\n\ndef effect_specs() -> tuple[ConfigEffectSpec, ...]:\n    return _SPECS\n\n\ndef legacy_compatibility_settings() -> tuple[str, ...]:\n    return _FROZEN_V10_SETTINGS\n\n\ndef expanded_config_paths(spec: ConfigEffectSpec, available_paths: Iterable[str]) -> tuple[str, ...]:\n    available = set(available_paths)\n    result: set[str] = set()\n    for path in spec.config_paths:\n        if path in available:\n            result.add(path)\n        profile = f\"profiles.*.{path}\"\n        if profile in available:\n            result.add(profile)\n    return tuple(sorted(result))\n''')

          extractor = Path('codex_wire_audit/extractors/config_effects.py')
          text = extractor.read_text()
          text = text.replace(
              'from ..config_effect_specs import effect_specs, expanded_config_paths',
              'from ..config_effect_specs import effect_specs, expanded_config_paths, legacy_compatibility_settings',
          )
          start = text.index('def _effect_links(')
          end = text.index('\n\n\nclass ConfigEffectsExtractor:', start)
          replacement = '''def _effect_links(\n    catalog: dict[str, Any],\n    sources: dict[str, SourceFile | None],\n) -> tuple[list[dict[str, Any]], list[str], list[dict[str, str]], list[str]]:\n    paths = set((catalog.get("paths") or {}).keys())\n    links: list[dict[str, Any]] = []\n    missing_paths: list[str] = []\n    missing_anchors: list[dict[str, str]] = []\n    covered_legacy: set[str] = set()\n    for spec in effect_specs():\n        expanded = expanded_config_paths(spec, paths)\n        if not expanded:\n            missing_paths.extend(spec.config_paths)\n            continue\n        for source_key, token in spec.source_checks:\n            source = sources.get(source_key)\n            if source is None or token not in source.text:\n                missing_anchors.append({"spec_id": spec.id, "source_key": source_key, "token": token})\n        if spec.legacy_setting:\n            covered_legacy.add(spec.legacy_setting)\n        links.append({\n            "id": spec.id,\n            "config_paths": list(expanded),\n            "target": spec.target_id,\n            "relation": spec.relation,\n            "behavior": spec.behavior,\n            "condition": spec.condition,\n            "proof_tier": spec.proof_tier,\n        })\n    return (\n        links,\n        sorted(set(missing_paths)),\n        sorted(missing_anchors, key=lambda item: (item["spec_id"], item["source_key"], item["token"])),\n        sorted(covered_legacy),\n    )\n'''
          text = text[:start] + replacement + text[end:]
          old = '        effect_links, missing_effect_paths = _effect_links(catalog)\n        complete = True\n'
          new = '''        effect_sources = {key: _source(snapshot, key) for key in SOURCE_IDS}\n        effect_links, missing_effect_paths, missing_effect_anchors, covered_legacy = _effect_links(\n            catalog, effect_sources\n        )\n        frozen_legacy = set(legacy_compatibility_settings())\n        missing_legacy = sorted(frozen_legacy - set(covered_legacy))\n        complete = True\n'''
          if old not in text:
              raise SystemExit('config extractor effect link marker missing')
          text = text.replace(old, new, 1)
          marker = '''        if missing_effect_paths:\n            complete = False\n            _emit(\n                diagnostics,\n                code="CONFIG_EFFECT_PATH_MISSING",\n                message="One or more required config-to-surface paths are absent from the generated schema.",\n                entity="config_effects",\n                source=schema_source,\n                details={"paths": missing_effect_paths},\n            )\n\n'''
          addition = marker + '''        for anchor in missing_effect_anchors:\n            complete = False\n            _emit(\n                diagnostics,\n                code="CONFIG_EFFECT_SOURCE_ANCHOR_MISSING",\n                message="A source anchor required by a canonical config-effect link is missing.",\n                entity=anchor["spec_id"],\n                source=effect_sources.get(anchor["source_key"]),\n                details=anchor,\n            )\n        if missing_legacy:\n            complete = False\n            _emit(\n                diagnostics,\n                code="CONFIG_LEGACY_EFFECT_COVERAGE_INCOMPLETE",\n                message="The frozen v10 wire-affecting setting catalog is not fully represented by canonical config-effect links.",\n                entity="config_effects.compatibility_closure",\n                source=schema_source,\n                details={"missing_settings": missing_legacy},\n            )\n\n'''
          if marker not in text:
              raise SystemExit('config extractor missing-path block marker missing')
          text = text.replace(marker, addition, 1)
          text = text.replace(
              '"effect_semantics": "canonical selected links; remaining legacy effects are connected during report composition",',
              '"effect_semantics": "canonical source-bound links; frozen v10 effects are regression-only and are not consumed by the canonical graph",\n                "legacy_compatibility_setting_count": len(frozen_legacy),\n                "legacy_compatibility_settings_covered": covered_legacy,\n                "legacy_compatibility_settings_missing": missing_legacy,\n                "missing_effect_source_anchors": missing_effect_anchors,',
          )
          text = text.replace('compose_surface_graph(data, {}, None)', 'compose_surface_graph(data, {})')
          extractor.write_text(text)

          graph = Path('codex_wire_audit/surface_graph.py')
          text = graph.read_text()
          start = text.index('def _legacy_effects(')
          end = text.index('\n\ndef compose_surface_graph(', start)
          text = text[:start] + text[end + 2:]
          text = text.replace(
              'def compose_surface_graph(\n    config_data: Mapping[str, Any],\n    extractors: Mapping[str, Any],\n    legacy_report: Mapping[str, Any] | None,\n) -> dict[str, Any]:',
              'def compose_surface_graph(\n    config_data: Mapping[str, Any],\n    extractors: Mapping[str, Any],\n) -> dict[str, Any]:',
          )
          text = text.replace(
              '        nodes[target] = _node(target, prefix, target.removeprefix("surface.").replace(".", " / "), declaration="config_effect_spec")',
              '        nodes[target] = _node(\n            target, prefix, target.removeprefix("surface.").replace(".", " / "),\n            declaration="config_effect_spec", effect_id=link.get("id"), proof_tier=link.get("proof_tier"),\n        )',
          )
          text = text.replace('    legacy_nodes, legacy_edges = _legacy_effects(legacy_report)\n    nodes.update(legacy_nodes)\n', '')
          text = text.replace('    edges.extend(edge for edge in legacy_edges if edge["source"] in nodes)\n', '')
          text = text.replace(
              '"legacy_effect_count": sum(edge.get("proof_tier") == "legacy_compatibility" for edge in edges),',
              '"legacy_effect_count": 0,\n            "legacy_compatibility_input": "not_consumed",',
          )
          graph.write_text(text)

          evolution = Path('codex_wire_audit/evolution.py')
          text = evolution.read_text()
          text = text.replace(', legacy_report: Mapping[str, Any] | None=None', '')
          text = text.replace('compose_surface_graph(config_data, results, legacy_report)', 'compose_surface_graph(config_data, results)')
          old_migration = "'migration': {'stage': 'hybrid_canonical_ir', 'canonical_ir_extractors': sorted(results), 'legacy_adapter': 'frozen v10 extraction/report renderer', 'legacy_machine_reconstruction_remaining': True, 'extension_contract': 'new source-aware semantic extractors register independently and emit canonical IR fragments; the compatibility adapter is not edited for new semantics'}"
          new_migration = "'migration': {'stage': 'canonical_ir', 'canonical_ir_extractors': sorted(results), 'legacy_adapter': 'outer v10 compatibility report only; excluded from system_contract', 'legacy_machine_reconstruction_remaining': False, 'extension_contract': 'source-derived semantic extractors compose the canonical system contract; frozen v10 rendering is compatibility-only'}"
          if old_migration not in text:
              raise SystemExit('evolution migration marker missing')
          text = text.replace(old_migration, new_migration, 1)
          evolution.write_text(text)

          orchestrator = Path('codex_wire_audit/orchestrator.py')
          text = orchestrator.read_text()
          old_call = "build_evolution_contract(snapshot, registry, diagnostics, coverage_profile=getattr(args, 'coverage_profile', 'codex_wire_full'), legacy_report=report)"
          new_call = "build_evolution_contract(snapshot, registry, diagnostics, coverage_profile=getattr(args, 'coverage_profile', 'codex_wire_full'))"
          if old_call not in text:
              raise SystemExit('orchestrator evolution call marker missing')
          orchestrator.write_text(text.replace(old_call, new_call, 1))

          for name in (\n              'codex_wire_audit/schema_templates/evolution-contract.schema.json',\n              'codex_wire_audit_v11_schemas/evolution-contract.schema.json',\n              '../contracts/codex-system-contract/v1/schema.json',\n          ):
              path = Path(name)
              schema_text = path.read_text()
              if '"const": "hybrid_canonical_ir"' not in schema_text:
                  raise SystemExit(f'migration stage schema marker missing: {name}')
              path.write_text(schema_text.replace('"const": "hybrid_canonical_ir"', '"const": "canonical_ir"'))

          tests = Path('tests/test_config_surface_v19.py')
          text = tests.read_text()
          text = text.replace(
              'from codex_wire_audit.config_schema_catalog import ConfigSchemaError, build_config_schema_catalog\n',
              'from codex_wire_audit.config_schema_catalog import ConfigSchemaError, build_config_schema_catalog\nfrom codex_wire_audit.config_effect_specs import legacy_compatibility_settings\n',
          )
          text = text.replace(
              '        "mcp_servers": {"type": "object", "additionalProperties": {"type": "object"}},\n',
              '''        "mcp_servers": {"type": "object", "additionalProperties": {"type": "object"}},\n        "mcp_oauth_credentials_store": {"type": "string"},\n        "mcp_oauth_callback_port": {"type": "integer"},\n        "mcp_oauth_callback_url": {"type": "string"},\n        "mcp_optional_startup_grace_ms": {"type": "integer"},\n        "apps_mcp_product_sku": {"type": "string"},\n        "orchestrator": {\n            "type": "object",\n            "properties": {\n                "skills": {"$ref": "#/definitions/OrchestratorFeatureToml"},\n                "mcp": {"$ref": "#/definitions/OrchestratorFeatureToml"},\n            },\n        },\n''',
              1,
          )
          text = text.replace(
              '            "ModelProviderInfo": {\n',
              '''            "OrchestratorFeatureToml": {\n                "type": "object",\n                "additionalProperties": False,\n                "properties": {"enabled": {"type": "boolean"}},\n            },\n            "ModelProviderInfo": {\n''',
              1,
          )
          text = text.replace(
              '        SOURCE_IDS["config_toml"]: "pub struct ConfigToml {}",\n        SOURCE_IDS["core_config"]: "pub struct Config {}",\n',
              '''        SOURCE_IDS["config_toml"]: """\n            pub struct OrchestratorToml { pub skills: Option<OrchestratorFeatureToml>, pub mcp: Option<OrchestratorFeatureToml> }\n            pub struct OrchestratorFeatureToml { pub enabled: Option<bool> }\n            pub struct ConfigToml {\n                pub mcp_oauth_credentials_store: Option<OAuthCredentialsStoreMode>,\n                pub mcp_oauth_callback_port: Option<u16>,\n                pub mcp_oauth_callback_url: Option<String>,\n                pub mcp_optional_startup_grace_ms: Option<u64>,\n                pub apps_mcp_product_sku: Option<String>,\n                pub orchestrator: Option<OrchestratorToml>,\n            }\n        """,\n        SOURCE_IDS["core_config"]: """\n            fn resolve_mcp_oauth_credentials_store_mode() {}\n            const DEFAULT_OPTIONAL_MCP_STARTUP_GRACE: u64 = 1000;\n            fn resolve_orchestrator_feature_enabled() {}\n            struct Config {\n                mcp_oauth_callback_port: Option<u16>,\n                mcp_oauth_callback_url: Option<String>,\n                mcp_optional_startup_grace: Duration,\n                apps_mcp_product_sku: Option<String>,\n                orchestrator_skills_enabled: bool,\n                orchestrator_mcp_enabled: bool,\n            }\n            fn build(cfg: ConfigToml) {\n                let _ = Config {\n                    mcp_oauth_callback_port: cfg.mcp_oauth_callback_port,\n                    mcp_oauth_callback_url: cfg.mcp_oauth_callback_url.clone(),\n                    apps_mcp_product_sku: cfg.apps_mcp_product_sku.clone(),\n                };\n            }\n        """,\n''',
              1,
          )
          old_test = '''def test_surface_graph_connects_canonical_and_legacy_effects() -> None:\n    diagnostics = DiagnosticCollector()\n    result = ConfigEffectsExtractor().extract(_snapshot(), diagnostics)\n    legacy = {\n        "config_protocol": {\n            "wire_affecting_settings": [\n                {\n                    "setting": "model",\n                    "wire_effects": [\n                        {"layer": "request_body", "path": "ResponsesApiRequest.model", "behavior": "select model"}\n                    ],\n                }\n            ]\n        }\n    }\n    graph = compose_surface_graph(result.data, {}, legacy)\n    assert graph["coverage"]["legacy_effect_count"] == 1\n    assert graph["views"]["by_config"]["config.model"]\n    assert graph["views"]["by_surface"]["surface.context_management.activation"]\n    assert graph["views"]["by_feature"]["feature.context_management"]\n    assert graph["coverage"]["schema_policy_count"] == len(FEATURE_KEYS)\n    assert graph["coverage"]["unresolved_node_refs"] == []\n\n\n'''
          new_test = '''def test_surface_graph_is_canonical_and_does_not_consume_legacy_effects() -> None:\n    diagnostics = DiagnosticCollector()\n    result = ConfigEffectsExtractor().extract(_snapshot(), diagnostics)\n    graph = compose_surface_graph(result.data, {})\n    assert graph["coverage"]["legacy_effect_count"] == 0\n    assert graph["coverage"]["legacy_compatibility_input"] == "not_consumed"\n    assert not any(key.startswith("legacy_surface.") for key in graph["nodes"])\n    assert not any(edge.get("proof_tier") == "legacy_compatibility" for edge in graph["edges"])\n    assert graph["views"]["by_config"]["config.model"]\n    assert graph["views"]["by_surface"]["surface.context_management.activation"]\n    assert graph["views"]["by_feature"]["feature.context_management"]\n    assert graph["coverage"]["schema_policy_count"] == len(FEATURE_KEYS)\n    assert graph["coverage"]["unresolved_node_refs"] == []\n\n\ndef test_frozen_v10_wire_setting_catalog_has_native_closure() -> None:\n    diagnostics = DiagnosticCollector()\n    result = ConfigEffectsExtractor().extract(_snapshot(), diagnostics)\n    expected = {\n        "model", "model_provider", "model_reasoning_effort", "model_reasoning_summary",\n        "model_verbosity", "service_tier", "web_search", "responses_api_metadata",\n        "mcp_servers", "mcp_oauth_credentials_store", "mcp_oauth_callback_port",\n        "mcp_oauth_callback_url", "mcp_optional_startup_grace_ms", "apps_mcp_product_sku",\n        "chatgpt_base_url", "openai_base_url", "orchestrator",\n    }\n    assert set(legacy_compatibility_settings()) == expected\n    assert set(result.data["coverage"]["legacy_compatibility_settings_covered"]) == expected\n    assert result.data["coverage"]["legacy_compatibility_settings_missing"] == []\n    assert result.data["surface_graph"]["coverage"]["legacy_effect_count"] == 0\n\n\ndef test_missing_native_effect_source_anchor_fails_visible() -> None:\n    snapshot = _snapshot()\n    core = snapshot.files[SOURCE_IDS["core_config"]]\n    snapshot.files[SOURCE_IDS["core_config"]] = SourceFile.create(\n        spec=core.spec,\n        selected_path=core.selected_path,\n        raw_bytes=core.raw_bytes.replace(b"orchestrator_mcp_enabled", b"orchestrator_mcp_removed"),\n    )\n    diagnostics = DiagnosticCollector()\n    result = ConfigEffectsExtractor().extract(snapshot, diagnostics)\n    assert not result.semantic_complete\n    assert "CONFIG_EFFECT_SOURCE_ANCHOR_MISSING" in {item.code for item in diagnostics.values()}\n\n\n'''
          if old_test not in text:
              raise SystemExit('legacy graph test marker missing')
          text = text.replace(old_test, new_test, 1)
          tests.write_text(text)

          v11_tests = Path('test_codex_wire_audit_v11.py')
          text = v11_tests.read_text()
          text = text.replace('self.assertEqual(contract["migration"]["stage"], "hybrid_canonical_ir")', 'self.assertEqual(contract["migration"]["stage"], "canonical_ir")')
          v11_tests.write_text(text)
          PY
          python -m pytest -q tests/test_config_surface_v19.py test_codex_wire_audit_v11.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
          make check-assets
          python tools/check_canonical_contract.py
