name: runtime-conformance-maintenance

on:
  push:
    branches:
      - runtime/conformance/feat/observed-contracts
    paths:
      - .github/workflows/runtime-conformance-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire strict runtime conformance evidence
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          gate = Path('codex_wire_audit/proof_gate.py')
          text = gate.read_text()
          import_marker = 'from .rust_semantics import analyze_turn_metadata_source\n'
          runtime_import = 'from .runtime_conformance import load_json_strict, validate_runtime_evidence\n'
          if runtime_import not in text:
              if import_marker not in text:
                  raise SystemExit('proof gate import marker missing')
              text = text.replace(import_marker, runtime_import + import_marker, 1)

          start = text.index('def _runtime_result(\n')
          end = text.index('\n\ndef build_attestation(', start)
          replacement = '''def _runtime_result(\n    report: dict[str, Any],\n    profile_id: str,\n    evidence: dict[str, Any] | None,\n    bag: DiagnosticBag,\n) -> dict[str, Any]:\n    profile = resolve_profile(profile_id)\n    required = tuple(sorted(set(profile.required_runtime_scenarios)))\n    if evidence is None:\n        return {\n            "status": "not_run",\n            "complete": not required,\n            "report_bound": False,\n            "source_bound": False,\n            "required_scenarios": list(required),\n            "passed_scenarios": [],\n            "missing_scenarios": list(required),\n        }\n\n    validation = validate_runtime_evidence(\n        evidence,\n        report,\n        profile_id=profile_id,\n        required_scenarios=required,\n    )\n    for diagnostic in validation.diagnostics:\n        bag.add(ProofDiagnostic(\n            code=diagnostic.code,\n            message=diagnostic.message,\n            source_id=diagnostic.source_id,\n            severity="error",\n            strict_failure=True,\n            recoverable=False,\n        ))\n    return validation.proof_summary()\n'''
          text = text[:start] + replacement + text[end:]

          old_loader = '''    runtime_evidence = None\n    if args.runtime_evidence is not None:\n        runtime_evidence = json.loads(args.runtime_evidence.read_text(encoding="utf-8"))\n        if not isinstance(runtime_evidence, dict):\n            raise ValueError("runtime evidence root must be a JSON object")\n'''
          new_loader = '''    runtime_evidence = None\n    if args.runtime_evidence is not None:\n        runtime_evidence = load_json_strict(args.runtime_evidence)\n'''
          if old_loader in text:
              text = text.replace(old_loader, new_loader, 1)
          elif new_loader not in text:
              raise SystemExit('proof gate runtime loader marker missing')
          gate.write_text(text)

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          script = 'codex-wire-audit-runtime = "codex_wire_audit.runtime_conformance:main"\n'
          marker = 'codex-wire-audit-history = "codex_wire_audit.history_cli:main"\n'
          if script not in text:
              if marker not in text:
                  raise SystemExit('pyproject script marker missing')
              text = text.replace(marker, marker + script, 1)
          pyproject.write_text(text)

          profiles_path = Path('codex_wire_audit/coverage_profiles.v3.json')
          profiles = json.loads(profiles_path.read_text())
          by_id = {row['id']: row for row in profiles['profiles']}
          full = by_id['codex_wire_full']
          required_scenarios = list(full['required_runtime_scenarios'])
          if 'runtime_conformance' not in full['required_dimensions']:
              raise SystemExit('codex_wire_full lost runtime_conformance dimension')
          if 'runtime_conformance_only' not in by_id:
              focused = {
                  'allow_legacy_reconstruction': False,
                  'description': (
                      'Focused bounded runtime-observation proof tied to one exact report, source/build identity, '
                      'platform, account class, network class, observer harness, assertions, and hashed artifacts.'
                  ),
                  'id': 'runtime_conformance_only',
                  'required_dimensions': ['schema', 'profile', 'runtime_conformance'],
                  'required_extractors': [],
                  'required_history_keys': [],
                  'required_runtime_scenarios': required_scenarios,
                  'version': '1.0.0',
              }
              idx = next(i for i, row in enumerate(profiles['profiles']) if row['id'] == 'fixture')
              profiles['profiles'].insert(idx, focused)
          profiles_path.write_text(json.dumps(profiles, indent=2) + '\n')

          release_path = Path('codex_wire_audit/release_spec.v1.json')
          release = json.loads(release_path.read_text())
          claims = release['capability_claims']
          if not any(row['id'] == 'runtime_conformance' for row in claims):
              claim = {
                  'extractor_ids': [],
                  'id': 'runtime_conformance',
                  'profile_assertions': {
                      'codex_wire_full': {
                          'required_dimensions_contains': ['runtime_conformance'],
                          'required_runtime_scenarios_contains': required_scenarios,
                      },
                      'runtime_conformance_only': {
                          'required_dimensions_contains': ['runtime_conformance'],
                          'required_runtime_scenarios_contains': required_scenarios,
                      },
                  },
                  'required_resources': [
                      'runtime_conformance.py',
                      'proof_gate.py',
                      'proof_schema_templates/runtime-conformance-evidence-v1.schema.json',
                      'coverage_profiles.v3.json',
                  ],
                  'status': 'active_package',
              }
              claims.insert(next(i for i, row in enumerate(claims) if row['id'] == 'canonical_system_contract'), claim)
          release_path.write_text(json.dumps(release, indent=2) + '\n')
          PY
          python -m pytest -q tests/test_runtime_conformance.py tests/test_machine_proof_v12.py
          python -m pytest -q
          python -m codex_wire_audit.runtime_conformance --help >/dev/null
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
      - name: Commit deterministic runtime outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/proof_gate.py \
            toolchain/pyproject.toml \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(runtime): wire strict conformance evidence and refresh deterministic assets'
          git push origin HEAD:runtime/conformance/feat/observed-contracts
