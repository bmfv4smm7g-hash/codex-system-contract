name: prompt-legacy-assets

on:
  push:
    branches:
      - contract/prompt/feat/context-instructions
    paths:
      - .github/workflows/prompt-legacy-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate legacy deterministic assets
        working-directory: toolchain
        run: make legacy-assets
      - name: Commit exact generated source-registry assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- toolchain/codex_wire_audit_v11_examples/source-registry.default.json toolchain/codex_wire_audit_v11_examples/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(prompt): refresh source registry assets'
          git push origin HEAD:contract/prompt/feat/context-instructions
