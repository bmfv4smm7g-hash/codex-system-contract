name: config-format-cleanup

on:
  push:
    branches:
      - contract/config/feat/native-effect-closure
    paths:
      - .github/workflows/config-format-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Normalize config extractor formatting
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('codex_wire_audit/extractors/config_effects.py')
          text = path.read_text()
          start = text.index('        complete = _validate_semantics(\n')
          end = text.index('\n\n        data: dict[str, Any] = {', start)
          call = (
              '        complete = _validate_semantics(\n'
              '            diagnostics,\n'
              '            catalog=catalog,\n'
              '            registry=registry,\n'
              '            schema_policy=schema_policy,\n'
              '            crosswalk=crosswalk,\n'
              '            missing_effect_paths=missing_effect_paths,\n'
              '            missing_effect_anchors=missing_effect_anchors,\n'
              '            missing_legacy=missing_legacy,\n'
              '            effect_sources=effect_sources,\n'
              '            schema_source=schema_source,\n'
              '            registry_source=registry_source,\n'
              '            schema_generator_source=schema_generator_source,\n'
              '        )'
          )
          text = text[:start] + call + text[end:]
          text = text.replace('\n\n\ndef _validate_semantics(', '\n\ndef _validate_semantics(', 1)
          path.write_text(text)
          PY
          python -m py_compile codex_wire_audit/extractors/config_effects.py
          python -m pytest -q tests/test_config_surface_v19.py
      - name: Commit formatting cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- toolchain/codex_wire_audit/extractors/config_effects.py
          git diff --cached --quiet && exit 0
          git commit -m 'style(config): normalize semantic validation layout'
          git push origin HEAD:contract/config/feat/native-effect-closure
