name: mcp-metrics-diagnostic

on:
  push:
    branches:
      - contract/mcp/feat/tool-projection
    paths:
      - .github/workflows/mcp-metrics-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply MCP registry activation in workspace and print guardrail offenders
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          registry = Path('codex_wire_audit/source_registry.py')
          text = registry.read_text()
          marker = '''            if group == SourceGroup.EXTRA and key == "config_toml":\n                roles.append("local_storage_configuration")\n                extractors = tuple(sorted(set((*extractors, "extractor.local_storage"))))\n            specs.append(\n'''
          replacement = '''            if group == SourceGroup.EXTRA and key == "config_toml":\n                roles.append("local_storage_configuration")\n                extractors = tuple(sorted(set((*extractors, "extractor.local_storage"))))\n            if group == SourceGroup.EXTRA and key in {"mcp_catalog", "mcp_runtime", "mcp_handler"}:\n                roles.append("mcp_projection")\n                expected_symbols = {\n                    "mcp_catalog": ("McpServerSource", "McpCatalogBuilder", "ResolvedMcpCatalog"),\n                    "mcp_runtime": ("McpConfig", "effective_mcp_servers", "ToolPluginProvenance"),\n                    "mcp_handler": ("McpHandler", "prepare_mcp_call", "handle_mcp_tool_call"),\n                }[key]\n                extractors = tuple(sorted(set((*extractors, "extractor.mcp_projection"))))\n            specs.append(\n'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
          insert = '''    specs.append(SourceSpec(\n        id="source_spec.extra.generated_config_schema",'''
          block = '''    mcp_specs = (\n        ("source_spec.extra.mcp_catalog", "mcp_catalog", "codex-rs/codex-mcp/src/catalog.rs", ("McpServerSource", "McpCatalogBuilder", "ResolvedMcpCatalog")),\n        ("source_spec.extra.mcp_runtime", "mcp_runtime", "codex-rs/codex-mcp/src/mcp/mod.rs", ("McpConfig", "effective_mcp_servers", "ToolPluginProvenance")),\n        ("source_spec.extra.mcp_tools", "mcp_tools", "codex-rs/codex-mcp/src/tools.rs", ("ToolInfo", "ToolFilter", "normalize_tools_for_model_with_prefix")),\n        ("source_spec.extra.mcp_tool_exposure", "mcp_tool_exposure", "codex-rs/core/src/mcp_tool_exposure.rs", ("McpHandlerCache", "append_mcp_tools", "tool_is_model_visible")),\n        ("source_spec.extra.mcp_tool_plan", "mcp_tool_plan", "codex-rs/core/src/tools/spec_plan.rs", ("build_tool_router", "apply_mcp_tool_exposure_policy", "omit_tools_from")),\n        ("source_spec.extra.mcp_handler", "mcp_handler", "codex-rs/core/src/tools/handlers/mcp.rs", ("McpHandler", "prepare_mcp_call", "handle_mcp_tool_call")),\n    )\n'''
          if 'mcp_specs = (' not in text:
              text = text.replace(insert, block + insert, 1)
          append = '''    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    return SourceRegistry(specs)'''
          replacement2 = '''    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    _append_optional_specs(specs, mcp_specs, role="mcp_projection", extractor_id="extractor.mcp_projection")\n    return SourceRegistry(specs)'''
          if 'mcp_specs, role="mcp_projection"' not in text:
              text = text.replace(append, replacement2, 1)
          registry.write_text(text)

          init = Path('codex_wire_audit/extractors/__init__.py')
          text = init.read_text()
          marker = 'from . import routing_transport as _routing_transport  # noqa: E402,F401\n'
          if '_mcp_projection' not in text:
              text = text.replace(marker, marker + 'from . import mcp_projection as _mcp_projection  # noqa: E402,F401\n', 1)
          init.write_text(text)

          from tools.maintainability_metrics import build_metrics
          metrics = build_metrics()['active_implementation']
          print('FUNCTIONS_OVER_200')
          print(json.dumps(metrics['functions_over_200_lines'], indent=2))
          print('MODULES_OVER_FAN_OUT_10')
          print(json.dumps(metrics['modules_over_fan_out_10'], indent=2))
          print('MAXIMUM_MODULE_FAN_OUT', metrics['maximum_module_fan_out'])
          print('LARGEST_FUNCTIONS')
          print(json.dumps(metrics['largest_functions'][:5], indent=2))
          PY
