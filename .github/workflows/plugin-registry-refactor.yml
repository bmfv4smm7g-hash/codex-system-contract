name: plugin-registry-refactor

on:
  push:
    branches:
      - contract/plugin/feat/runtime-capabilities
    paths:
      - .github/workflows/plugin-registry-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Deduplicate registry domain registration
        run: python .github/_plugin_registry_refactor.py
      - name: Validate registry and plugin domain
        working-directory: toolchain
        run: |
          python -m pytest -q tests/test_plugin_runtime_extractor.py
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python tools/maintainability_metrics.py --check
      - name: Commit guardrail repair and deterministic assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit_v11_examples \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(plugin): deduplicate domain source registration'
          git push origin HEAD:contract/plugin/feat/runtime-capabilities
