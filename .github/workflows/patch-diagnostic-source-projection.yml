name: patch-diagnostic-source-projection

on:
  workflow_dispatch:
  push:
    branches: [fix/metadata-projection-release]
    paths:
      - ".github/workflows/patch-diagnostic-source-projection.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/metadata-projection-release
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Patch diagnostic source projection and regression coverage
        run: python -c "import base64; exec(compile(base64.b64decode(''), 'patch.py', 'exec'))"
      - name: Regenerate committed maintainability assets
        working-directory: toolchain
        run: python tools/maintainability_metrics.py --write
      - name: Check patched Python syntax
        run: python -m py_compile toolchain/codex_wire_audit/orchestrator.py toolchain/tests/test_metadata_projection_boundary.py
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            toolchain/codex_wire_audit/orchestrator.py \
            toolchain/tests/test_metadata_projection_boundary.py \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git commit -m "fix: project bare source-spec diagnostic refs"
          git push origin HEAD:fix/metadata-projection-release
