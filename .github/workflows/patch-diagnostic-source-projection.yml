name: patch-diagnostic-source-projection

on:
  workflow_dispatch:
  push:
    branches: [fix/metadata-projection-release]
    paths:
      - ".github/workflows/patch-diagnostic-source-projection.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/metadata-projection-release
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Patch bare source-spec projection and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path("toolchain/codex_wire_audit/orchestrator.py")
          text = orchestrator.read_text(encoding="utf-8")
          old = """    for spec_id, record in snapshot_files.items():
                  prefix = f'{spec_id}:'
                  if not source_ref.startswith(prefix):
                      continue
                  if not isinstance(record, Mapping):
                      return source_ref
                  path_ref = source_ref[len(prefix):]
                  selected_path = record.get('path')
          """
          new = """    for spec_id, record in snapshot_files.items():
                  if source_ref == spec_id:
                      if not isinstance(record, Mapping):
                          return source_ref
                      selected_path = record.get('path')
                      if isinstance(selected_path, str):
                          return resolve_path(selected_path) or source_ref
                      return source_ref
                  prefix = f'{spec_id}:'
                  if not source_ref.startswith(prefix):
                      continue
                  if not isinstance(record, Mapping):
                      return source_ref
                  path_ref = source_ref[len(prefix):]
                  selected_path = record.get('path')
          """
          if old not in text:
              raise SystemExit("orchestrator projection block did not match")
          orchestrator.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("toolchain/tests/test_metadata_projection_boundary.py")
          test_text = test_path.read_text(encoding="utf-8")
          addition = '''


def test_bare_source_spec_diagnostic_refs_project_to_manifest_sources() -> None:
    """Canonical source-spec IDs map into the frozen v10 manifest namespace."""

    selected_path = "codex-rs/models-manager/src/manager.rs"
    report = {
        "source_manifest": {
            "files": {"source.models-manager": {"path": selected_path}},
            "locations": {},
            "path_index": {selected_path: "source.models-manager"},
            "exact_snapshot": {
                "files": {
                    "source_spec.extra.models_manager": {"path": selected_path}
                }
            },
        }
    }
    diagnostic = {
        "id": "diagnostic.fixture",
        "source_refs": ["source_spec.extra.models_manager"],
        "details": {},
    }

    projected = C._project_diagnostic_source_refs(report, diagnostic)

    assert projected["source_refs"] == ["source.models-manager"]
    assert projected["details"]["canonical_source_refs"] == [
        "source_spec.extra.models_manager"
    ]
'''
          if "test_bare_source_spec_diagnostic_refs_project_to_manifest_sources" not in test_text:
              test_path.write_text(test_text.rstrip() + addition + "\n", encoding="utf-8")
          PY
      - name: Regenerate maintainability assets
        working-directory: toolchain
        run: python tools/maintainability_metrics.py --write
      - name: Run focused regression tests
        working-directory: toolchain
        run: python -m pytest -q tests/test_metadata_projection_boundary.py
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            toolchain/codex_wire_audit/orchestrator.py \
            toolchain/tests/test_metadata_projection_boundary.py \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git commit -m "fix: project bare source-spec diagnostic refs"
          git push origin HEAD:fix/metadata-projection-release
