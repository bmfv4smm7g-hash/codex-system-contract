name: generate-model-capability-assets

on:
  push:
    branches:
      - feat/model-capability-fingerprint
    paths:
      - "toolchain/**"
      - ".github/workflows/_generate_model_capability_assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/model-capability-fingerprint
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install package and tests
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Run focused model capability tests
        working-directory: toolchain
        run: python -m pytest -q tests/test_responses_server_response_extractor.py
      - name: Regenerate deterministic assets
        working-directory: toolchain
        run: |
          python tools/build_v11_assets.py
          python tools/maintainability_metrics.py --write
      - name: Commit generated assets
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/codex_wire_audit_v11_examples toolchain/codex_wire_audit_v11_schemas toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md toolchain/codex_wire_audit_v19_maintainability_metrics.json
          git commit -m "chore: regenerate model capability assets"
          git push origin HEAD:feat/model-capability-fingerprint
