name: runtime-conformance-hardening

on:
  push:
    branches:
      - runtime/conformance/feat/observed-contracts
    paths:
      - .github/workflows/runtime-conformance-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Harden runtime evidence source and status binding
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('codex_wire_audit/runtime_conformance.py')
          text = module.read_text()
          old = '''    passed = {item["id"] for item in scenarios if item["status"] == "passed"}\n    status = "complete" if not (set(required) - passed) else "partial"\n'''
          new = '''    passed = {item["id"] for item in scenarios if item["status"] == "passed"}\n    status = (\n        "complete"\n        if not (set(required) - passed) and all(item["status"] == "passed" for item in scenarios)\n        else "partial"\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('assembly status marker missing')

          old = '''        source_bound = (\n            (report_repository is None or scope["source_repository"] == report_repository)\n            and (report_commit is None or scope["source_commit"] == report_commit)\n        )\n'''
          new = '''        source_bound = (\n            report_repository is not None\n            and report_commit is not None\n            and scope["source_repository"] == report_repository\n            and scope["source_commit"] == report_commit\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('source binding marker missing')

          old = '''        calculated_status = "complete" if not (set(required) - passed) else "partial"\n'''
          new = '''        calculated_status = (\n            "complete"\n            if not (set(required) - passed) and all(item["status"] == "passed" for item in scenarios)\n            else "partial"\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('validation status marker missing')
          module.write_text(text)

          tests = Path('tests/test_runtime_conformance.py')
          text = tests.read_text()
          if 'test_missing_report_source_identity_fails_closed' not in text:
              text += '''\n\ndef test_missing_report_source_identity_fails_closed() -> None:\n    report = _report()\n    del report["source_revision"]\n    evidence = assemble_runtime_evidence(\n        report,\n        profile_id="codex_wire_full",\n        scope=_scope(),\n        observer=_observer(),\n        observations=_all_scenarios(),\n    )\n    profile = resolve_profile("codex_wire_full")\n    result = validate_runtime_evidence(\n        evidence,\n        report,\n        profile_id="codex_wire_full",\n        required_scenarios=profile.required_runtime_scenarios,\n    )\n    assert not result.complete\n    assert not result.source_bound\n    assert any(item.code == "RUNTIME_EVIDENCE_SOURCE_MISMATCH" for item in result.diagnostics)\n\n\ndef test_extra_failed_observation_forces_partial_status() -> None:\n    report = _report()\n    scenarios = _all_scenarios()\n    scenarios.append(_scenario("optional_canary", status="failed"))\n    evidence = assemble_runtime_evidence(\n        report,\n        profile_id="codex_wire_full",\n        scope=_scope(),\n        observer=_observer(),\n        observations=scenarios,\n    )\n    assert evidence["status"] == "partial"\n    profile = resolve_profile("codex_wire_full")\n    result = validate_runtime_evidence(\n        evidence,\n        report,\n        profile_id="codex_wire_full",\n        required_scenarios=profile.required_runtime_scenarios,\n    )\n    assert not result.complete\n    assert any(item.code == "RUNTIME_EVIDENCE_INVALID" for item in result.diagnostics) is False\n'''
          tests.write_text(text)
          PY
          python -m pytest -q tests/test_runtime_conformance.py tests/test_machine_proof_v12.py
          python -m pytest -q
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
      - name: Commit hardened runtime contract
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/runtime_conformance.py \
            toolchain/tests/test_runtime_conformance.py \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix(runtime): fail closed on source identity and partial observations'
          git push origin HEAD:runtime/conformance/feat/observed-contracts
