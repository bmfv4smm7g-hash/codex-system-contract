name: patch-catalog-variants

on:
  workflow_dispatch:
  push:
    branches: [fix/metadata-projection-release]
    paths:
      - ".github/workflows/patch-catalog-variants.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/metadata-projection-release
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply source-derived catalog variant patch
        run: |
          python .github/scripts/apply_catalog_variant_patch.py
          python .github/scripts/modularize_catalog_patch.py
      - name: Install package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Run focused catalog and metadata tests
        working-directory: toolchain
        run: |
          python -m pytest -q \
            tests/test_responses_server_response_extractor.py \
            tests/test_metadata_projection_boundary.py
      - name: Run complete regression suite
        working-directory: toolchain
        run: python -m pytest -q
      - name: Regenerate and verify maintainability assets
        working-directory: toolchain
        run: |
          python tools/maintainability_metrics.py --write
          python tools/maintainability_metrics.py --check
      - name: Validate exact pinned Codex release input
        working-directory: toolchain
        run: |
          set -euo pipefail
          codex="$RUNNER_TEMP/codex-source"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          codex-wire-audit --json \
            --repo-root "$codex" \
            --coverage-profile hybrid_v19 \
            --fail-on error \
            --fail-on-semantic-change never \
            --output "$RUNNER_TEMP/report.json"
      - name: Commit production repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            toolchain/codex_wire_audit/extractors/responses_server_catalog.py \
            toolchain/codex_wire_audit/extractors/responses_server_response.py \
            toolchain/codex_wire_audit/proof_schema_templates/responses-server-response-semantics-v1.schema.json \
            toolchain/tests/test_responses_server_response_extractor.py \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git commit -m "fix: derive model catalog implementation variants"
          git push origin HEAD:fix/metadata-projection-release
