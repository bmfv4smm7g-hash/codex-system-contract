name: codex-current-main-contract-canary

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

concurrency:
  group: codex-current-main-contract-canary
  cancel-in-progress: true

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: main
          path: codex-current-main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained audit package
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Generate and verify the current-main canonical contract
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/codex-current-main-contract"
          mkdir -p "$evidence"
          git -C codex-current-main rev-parse HEAD | tee "$evidence/codex-head.txt"
          python toolchain/tools/check_config_surface.py \
            --codex-root codex-current-main \
            --output "$evidence/config-integration.json" \
            --schema-output "$evidence/config-schema.json" \
            --graph-output "$evidence/config-surface-graph.json"
          codex-wire-audit --json \
            --repo-root codex-current-main \
            --coverage-profile hybrid_v19 \
            --emit-system-contract "$evidence/system-contract.json" \
            --output "$evidence/report.json"
          python toolchain/tools/check_canonical_contract.py \
            --report "$evidence/report.json" \
            --source-root codex-current-main \
            --output "$evidence/source-byte-proof.json"
      - name: Upload current-main canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-current-main-contract-canary
          path: ${{ runner.temp }}/codex-current-main-contract
          if-no-files-found: warn
          retention-days: 30
