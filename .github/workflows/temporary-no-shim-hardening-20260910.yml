name: temporary-direct-authority-repair-20260915

on:
  push:
    branches:
      - system-contract/fix/direct-authority
    paths:
      - .github/workflows/temporary-no-shim-hardening-20260910.yml
      - .github/direct-contract-postprocess.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-direct-authority-repair-20260915
  cancel-in-progress: false

jobs:
  harden-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Record immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'system-contract/fix/direct-authority'
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Install constrained development dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'

      - name: Harden and materialize direct canonical design
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/direct-contract-migration-v2.py
          test -f .github/direct-contract-postprocess.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/direct-contract-migration-v2.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)if victim not in unavailable:\n'
              r'(?P=indent)    unavailable\.append\(victim\)'
          )
          replacement = (
              r'\g<indent>if victim not in unavailable:\n'
              r'\g<indent>    unavailable[victim] = "test fixture intentionally unavailable"'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one unavailable_specs mutation, found {count}')

          old = (
              '    def visit_ImportFrom(self, node: ast.ImportFrom):\n'
              '        if node.module and node.module.endswith("compatibility_views"):\n'
              '            return None\n'
              '        return self.generic_visit(node)\n'
              '\n'
              '    def visit_Import(self, node: ast.Import):\n'
              '        node.names = [alias for alias in node.names if not alias.name.endswith("compatibility_views")]\n'
              '        return node if node.names else None\n'
          )
          new = (
              '    def visit_ImportFrom(self, node: ast.ImportFrom):\n'
              '        if node.module and node.module.endswith("compatibility_views"):\n'
              '            return None\n'
              '        node.names = [alias for alias in node.names if alias.name not in REMOVED_IDENTIFIERS]\n'
              '        return self.generic_visit(node) if node.names else None\n'
              '\n'
              '    def visit_Import(self, node: ast.Import):\n'
              '        node.names = [\n'
              '            alias for alias in node.names\n'
              '            if not alias.name.endswith("compatibility_views")\n'
              '            and alias.name.rsplit(".", 1)[-1] not in REMOVED_IDENTIFIERS\n'
              '        ]\n'
              '        return self.generic_visit(node) if node.names else None\n'
          )
          if old not in text:
              raise SystemExit('expected RemoveAdapter import handlers were not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/direct-contract-migration-v2.py
          python .github/direct-contract-postprocess.py
          rm -f .github/direct-contract-migration-v2.py
          rm -f .github/direct-contract-postprocess.py
          rm -f .github/workflows/review-canonical-source.yml
          rm -f .github/workflows/canonical-representation-v2.yml
          rm -f .github/canonical_bootstrap_v2.py
          rm -f .github/workflows/temporary-canonical-main-finalizer-20260909.yml

      - name: Repair remaining tests and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import re

          removed = {
              'compatibility_views',
              'apply_config_surface_overlay',
              'apply_local_storage_overlay',
          }
          for path in sorted(Path('toolchain/tests').glob('test_*.py')):
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(path))
              changed = False
              body: list[ast.stmt] = []
              for node in tree.body:
                  if isinstance(node, ast.ImportFrom):
                      names = [alias for alias in node.names if alias.name not in removed]
                      if len(names) != len(node.names):
                          changed = True
                          node.names = names
                      if not node.names:
                          continue
                  elif isinstance(node, ast.Import):
                      names = [
                          alias for alias in node.names
                          if alias.name.rsplit('.', 1)[-1] not in removed
                      ]
                      if len(names) != len(node.names):
                          changed = True
                          node.names = names
                      if not node.names:
                          continue
                  body.append(node)
              if changed:
                  tree.body = body
                  ast.fix_missing_locations(tree)
                  compile(tree, str(path), 'exec')
                  path.write_text(ast.unparse(tree).rstrip() + '\n', encoding='utf-8')

          path = Path('LOCAL_STORAGE_AND_ROLLOUT_LAYOUT.md')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'Generated reports expose the contract in two places:\n\n'
              r'```text\nreport\.local_storage_schema\n'
              r'report\.evolution_contract\.extractors\["extractor\.local_storage"\]\.data\n```\n'
          )
          replacement = (
              'Generated reports expose the contract once:\n\n'
              '```text\n'
              'report.system_contract.model.extractors["extractor.local_storage"].data\n'
              '```\n'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one duplicate local-storage report section, found {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Enforce direct authority at the public boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e toolchain/codex_wire_audit/compatibility_views.py
          test ! -e .github/direct-contract-migration-v2.py
          test ! -e .github/direct-contract-postprocess.py
          test ! -e .github/workflows/review-canonical-source.yml
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path('toolchain/codex_wire_audit')
          removed_symbols = {
              'compatibility_views',
              'apply_config_surface_overlay',
              'apply_local_storage_overlay',
          }
          violations: list[str] = []
          for path in sorted(root.rglob('*.py')):
              try:
                  tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except SyntaxError as error:
                  violations.append(f'{path}: syntax error: {error}')
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      module = node.module or ''
                      if module.rsplit('.', 1)[-1] == 'compatibility_views':
                          violations.append(f'{path}:{node.lineno}: imports compatibility shim')
                      for alias in node.names:
                          if alias.name in removed_symbols:
                              violations.append(f'{path}:{node.lineno}: imports removed symbol {alias.name}')
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.rsplit('.', 1)[-1] in removed_symbols:
                              violations.append(f'{path}:{node.lineno}: imports removed symbol {alias.name}')
                  elif isinstance(node, ast.Name) and node.id in removed_symbols:
                      violations.append(f'{path}:{node.lineno}: references removed symbol {node.id}')
          if violations:
              raise SystemExit('\n'.join(violations))
          PY
          python - <<'PY'
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path

          from codex_wire_audit.system_contract import attach_system_contract, build_system_contract
          from codex_wire_audit.system_contract_validation import validate_system_contract

          fixture = json.loads(
              Path('contracts/codex-system-contract/v1/example.fixture.json').read_text(encoding='utf-8')
          )
          model = fixture['model']
          contract = build_system_contract(model)
          expected = {'$schema', 'schema', 'authority', 'model', 'integrity'}
          if set(contract) != expected:
              raise SystemExit(f'unexpected direct contract keys: {sorted(contract)}')
          validate_system_contract(contract)

          report = {'evolution_contract': copy.deepcopy(model), 'diagnostics': []}
          attach_system_contract(report)
          if set(report) != {'system_contract', 'diagnostics'}:
              raise SystemExit(f'construction model leaked into report: {sorted(report)}')
          validate_system_contract(report['system_contract'], report=report)

          for key in ('config_schema', 'config_surface_graph', 'local_storage_schema'):
              candidate = {'evolution_contract': copy.deepcopy(model), key: {}}
              try:
                  attach_system_contract(candidate)
              except ValueError:
                  continue
              raise SystemExit(f'parallel public representation was accepted: {key}')
          PY

      - name: Generate deterministic assets
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          if python tools/check_canonical_contract.py --help 2>&1 | grep -q -- '--write-assets'; then
            python tools/check_canonical_contract.py --write-assets
          fi
          python tools/maintainability_metrics.py --write

      - name: Prove exact candidate
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-shim-proof"
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/no-shim-proof/pytest.txt"
          make check-assets | tee "$RUNNER_TEMP/no-shim-proof/assets.txt"
          python tools/maintainability_metrics.py --check | tee "$RUNNER_TEMP/no-shim-proof/maintainability.txt"
          python tools/check_canonical_contract.py --output "$RUNNER_TEMP/no-shim-proof/canonical.json"
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/no-shim-proof/source-capabilities.json"
          python tools/release_pipeline.py release --output-dir "$RUNNER_TEMP/no-shim-release" | tee "$RUNNER_TEMP/no-shim-proof/release.json"
          python tools/release_pipeline.py verify --release-dir "$RUNNER_TEMP/no-shim-release" | tee "$RUNNER_TEMP/no-shim-proof/release-verify.json"

      - name: Validate pinned Codex integration
        shell: bash
        env:
          PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$RUNNER_TEMP/no-shim-proof/pinned-integration.json" \
            --schema-output "$RUNNER_TEMP/no-shim-proof/config-schema.json" \
            --graph-output "$RUNNER_TEMP/no-shim-proof/config-surface-graph.json"

      - name: Publish only the proved repair branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-no-shim-hardening-20260910.yml
          git add -A
          git diff --cached --check
          tested_tree="$(git write-tree)"
          test -n "$tested_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(system-contract): enforce direct authority'
          git fetch --no-tags origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$START_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf '{"start":"%s","commit":"%s","tree":"%s","force":false}\n' \
            "$START_SHA" "$(git rev-parse HEAD)" "$tested_tree" \
            > "$RUNNER_TEMP/no-shim-proof/publication.json"

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-authority-repair-proof
          path: ${{ runner.temp }}/no-shim-proof
          if-no-files-found: warn
          retention-days: 30
