name: environment-domain-maintenance

on:
  push:
    branches:
      - contract/environment/feat/execution-context
    paths:
      - .github/workflows/environment-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Apply exact environment-domain wiring
        run: python .github/_environment_domain_patch.py
      - name: Validate environment domain
        working-directory: toolchain
        run: python -m pytest -q tests/test_execution_environment_extractor.py
      - name: Regenerate deterministic assets
        working-directory: toolchain
        run: |
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python tools/maintainability_metrics.py --check
      - name: Commit domain wiring and deterministic evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/extractors/execution_environment.py \
            toolchain/tests/test_execution_environment_extractor.py \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat(environment): wire execution context into contract proof'
          git push origin HEAD:contract/environment/feat/execution-context
