name: prompt-domain-maintenance

on:
  push:
    branches:
      - contract/prompt/feat/context-instructions
    paths:
      - .github/workflows/prompt-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Correct prompt migration profile and test domain
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('codex_wire_audit/coverage_profiles.v3.json')
          text = path.read_text()
          old = '"key.turn_metadata.code_mode_tool_namespaces_info",'
          new = '"key.turn_metadata.code_mode_tool_names",\n        "key.turn_metadata.tool_namespaces_info",'
          if old not in text:
              raise SystemExit('expected migration typo not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m pytest -q tests/test_prompt_context_extractor.py
          python tools/maintainability_metrics.py --write
      - name: Commit exact deterministic maintenance outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- toolchain/codex_wire_audit/coverage_profiles.v3.json toolchain/codex_wire_audit_v19_maintainability_metrics.json toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(prompt): refresh profile and maintainability evidence'
          git push origin HEAD:contract/prompt/feat/context-instructions
