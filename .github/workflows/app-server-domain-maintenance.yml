name: app-server-domain-maintenance

on:
  push:
    branches:
      - contract/app-server/feat/rpc-lifecycle
    paths:
      - .github/workflows/app-server-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire native app-server RPC domain
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          extractor = Path('codex_wire_audit/extractors/app_server_rpc.py')
          text = extractor.read_text()
          old_fields = '''def _struct_fields(text: str, name: str) -> list[str]:\n    body = _balanced_block(text, f"pub struct {name}")\n    if body is None:\n        return []\n    return re.findall(r"(?m)^\\s{4}pub\\s+(?:r#)?([A-Za-z_][A-Za-z0-9_]*)\\s*:", body)\n'''
          new_fields = '''def _struct_fields(text: str, name: str) -> list[str]:\n    body = _balanced_block(text, f"pub struct {name}")\n    if body is None:\n        return []\n    return re.findall(\n        r"(?:^\\s*|,\\s*)(?:#\\[[^\\]]+\\]\\s*)*pub\\s+(?:r#)?([A-Za-z_][A-Za-z0-9_]*)\\s*:",\n        body,\n        re.MULTILINE,\n    )\n'''
          if old_fields in text:
              text = text.replace(old_fields, new_fields, 1)
          elif 'r"(?:^\\s*|,\\s*)' not in text:
              raise SystemExit('struct field parser marker missing')

          old_enum = '''def _enum_variants(text: str, name: str) -> list[str]:\n    body = _balanced_block(text, f"pub enum {name}")\n    if body is None:\n        return []\n    variants = re.findall(r"(?m)^\\s{4}(?:#\\[[^\\n]+\\]\\s*)*([A-Z][A-Za-z0-9_]*)\\b", body)\n    return list(dict.fromkeys(variants))\n'''
          new_enum = '''def _enum_variants(text: str, name: str) -> list[str]:\n    body = _balanced_block(text, f"pub enum {name}")\n    if body is None:\n        return []\n    variants = re.findall(\n        r"(?:^|,)\\s*(?:#\\[[^\\]]+\\]\\s*)*([A-Z][A-Za-z0-9_]*)\\b",\n        body,\n        re.MULTILINE,\n    )\n    return list(dict.fromkeys(variants))\n'''
          if old_enum in text:
              text = text.replace(old_enum, new_enum, 1)
          elif 'r"(?:^|,)\\s*' not in text:
              raise SystemExit('enum parser marker missing')

          if 'def _build_contract_body(' not in text:
              class_marker = '\n\nclass AppServerRpcExtractor:\n'
              helper = '''\n\ndef _build_contract_body(\n    *,\n    common: SourceFile,\n    thread: SourceFile,\n    thread_data: SourceFile,\n    turn: SourceFile,\n    item: SourceFile,\n    rpc: SourceFile,\n    requests: list[dict[str, str]],\n    notifications: list[dict[str, str]],\n    thread_statuses: list[str],\n    turn_statuses: list[str],\n    history_modes: list[str],\n    item_views: list[str],\n    complete: bool,\n) -> dict[str, Any]:\n    return {\n        "$schema": SCHEMA_ID,\n        "schema_version": SCHEMA_VERSION,\n        "ownership": {\n            "owns": [\n                "app-server request/response/notification wire dispatch",\n                "thread/turn/item lifecycle payload shape",\n                "per-request serialization scope",\n                "thread history mode and item hydration view",\n                "turn lifecycle status and steering precondition",\n                "thread/turn/item pagination request shape",\n            ],\n            "does_not_own": [\n                "local rollout or SQLite persistence implementation",\n                "Responses upstream request/event transport",\n                "permission/approval policy semantics",\n                "MCP/plugin capability projection",\n                "multi-agent execution/control internals",\n                "account/realtime/application feature APIs outside lifecycle dispatch",\n            ],\n        },\n        "rpc_envelope": {\n            "dialect": "JSON-RPC-shaped but omits the jsonrpc=2.0 wire field",\n            "request_id": ["string", "integer"],\n            "request": ["id", "method", "optional params", "optional W3C trace"],\n            "notification": ["method", "optional params"],\n            "response": ["id", "result"],\n            "error": ["id", "error.code", "error.message", "optional error.data"],\n        },\n        "request_dispatch": requests,\n        "notification_dispatch": notifications,\n        "thread": {\n            "statuses": thread_statuses,\n            "history_modes": history_modes,\n            "identity_fields": _struct_fields(thread_data.text, "Thread"),\n            "start_fields": _struct_fields(thread.text, "ThreadStartParams"),\n            "resume_fields": _struct_fields(thread.text, "ThreadResumeParams"),\n            "read_fields": _struct_fields(thread.text, "ThreadReadParams"),\n            "list_fields": _struct_fields(thread.text, "ThreadListParams"),\n            "turns_list_fields": _struct_fields(thread.text, "ThreadTurnsListParams"),\n            "items_list_fields": _struct_fields(thread.text, "ThreadItemsListParams"),\n            "resume_precedence": "for non-running threads: history > non-empty path > thread_id; a running thread_id rejoins the live thread and a supplied path becomes a consistency check",\n        },\n        "turn": {\n            "statuses": turn_statuses,\n            "items_views": item_views,\n            "data_fields": _struct_fields(thread_data.text, "Turn"),\n            "start_fields": _struct_fields(turn.text, "TurnStartParams"),\n            "steer_fields": _struct_fields(turn.text, "TurnSteerParams"),\n            "interrupt_fields": _struct_fields(turn.text, "TurnInterruptParams"),\n            "steer_precondition": "expectedTurnId must match the currently active turn",\n        },\n        "pagination": {\n            "thread_list": "opaque cursor + optional limit over thread summaries",\n            "turn_list": "threadId + opaque cursor + optional limit; use for paginated history instead of full thread/read hydration",\n            "item_list": "threadId + optional turnId + opaque cursor + optional limit across persisted item history",\n            "items_view": "NotLoaded, Summary, and Full describe hydration independently of turn status",\n        },\n        "evidence": {\n            "common": _evidence(common, "client_request_definitions/server_notification_definitions"),\n            "thread": _evidence(thread, "ThreadStartParams/ThreadResumeParams/pagination params"),\n            "thread_data": _evidence(thread_data, "Thread/Turn/ThreadHistoryMode/TurnItemsView"),\n            "turn": _evidence(turn, "TurnStatus/TurnStartParams/TurnSteerParams/TurnInterruptParams"),\n            "item": _evidence(item, "ThreadItem"),\n            "rpc": _evidence(rpc, "JSONRPCMessage/JSONRPCRequest/JSONRPCNotification"),\n        },\n        "semantic_complete": complete,\n    }\n'''
              if class_marker not in text:
                  raise SystemExit('app-server extractor class marker missing')
              text = text.replace(class_marker, helper + class_marker, 1)
              class_start = text.index('class AppServerRpcExtractor:')
              body_start = text.index('        body: dict[str, Any] = {', class_start)
              decorator_start = text.index('\n\n@register_extractor(EXTRACTOR_ID)', body_start)
              replacement = '''        body = _build_contract_body(\n            common=common,\n            thread=thread,\n            thread_data=thread_data,\n            turn=turn,\n            item=item,\n            rpc=rpc,\n            requests=requests,\n            notifications=notifications,\n            thread_statuses=thread_statuses,\n            turn_statuses=turn_statuses,\n            history_modes=history_modes,\n            item_views=item_views,\n            complete=complete,\n        )\n        body["semantic_digest"] = hashlib.sha256(_canonical(body)).hexdigest()\n        return ExtractorResult(\n            extractor_id=EXTRACTOR_ID,\n            schema_version=SCHEMA_VERSION,\n            data=body,\n            semantic_complete=complete,\n            source_spec_ids=self.source_spec_ids,\n        )\n'''
              text = text[:body_start] + replacement + text[decorator_start:]
          extractor.write_text(text)

          registry = Path('codex_wire_audit/source_registry.py')
          text = registry.read_text()
          marker = '\n\n_MCP_SPECS = (\n'
          block = '''\n\n_APP_SERVER_RPC_SPECS = (\n    ("source_spec.extra.app_server_common", "app_server_common", "codex-rs/app-server-protocol/src/protocol/common.rs", ("client_request_definitions", "server_notification_definitions", "ClientRequestSerializationScope")),\n    ("source_spec.extra.app_server_thread", "app_server_thread", "codex-rs/app-server-protocol/src/protocol/v2/thread.rs", ("ThreadStartParams", "ThreadResumeParams", "ThreadStatus", "ThreadTurnsListParams", "ThreadItemsListParams")),\n    ("source_spec.extra.app_server_thread_data", "app_server_thread_data", "codex-rs/app-server-protocol/src/protocol/v2/thread_data.rs", ("ThreadHistoryMode", "Thread", "Turn", "TurnItemsView")),\n    ("source_spec.extra.app_server_turn", "app_server_turn", "codex-rs/app-server-protocol/src/protocol/v2/turn.rs", ("TurnStatus", "TurnStartParams", "TurnSteerParams", "TurnInterruptParams")),\n    ("source_spec.extra.app_server_item", "app_server_item", "codex-rs/app-server-protocol/src/protocol/v2/item.rs", ("ThreadItem",)),\n    ("source_spec.extra.app_server_rpc", "app_server_rpc", "codex-rs/app-server-protocol/src/rpc.rs", ("JSONRPCMessage", "JSONRPCRequest", "JSONRPCNotification", "JSONRPCResponse", "JSONRPCError")),\n)\n\ndef _merge_app_server_domain_specs(specs: list[SourceSpec]) -> None:\n    _merge_optional_specs(\n        specs,\n        _APP_SERVER_RPC_SPECS,\n        role="app_server_rpc",\n        extractor_id="extractor.app_server_rpc",\n    )\n'''
          if '_APP_SERVER_RPC_SPECS = (' not in text:
              if marker not in text:
                  raise SystemExit('app-server registry insertion marker missing')
              text = text.replace(marker, block + marker, 1)
          append_marker = '''    _merge_routing_domain_specs(specs)\n    _merge_protocol_domain_specs(specs)\n    return SourceRegistry(specs)'''
          append_replacement = '''    _merge_routing_domain_specs(specs)\n    _merge_protocol_domain_specs(specs)\n    _merge_app_server_domain_specs(specs)\n    return SourceRegistry(specs)'''
          if '_merge_app_server_domain_specs(specs)' not in text.split('def from_legacy_maps', 1)[-1]:
              if append_marker not in text:
                  raise SystemExit('app-server registry merge marker missing')
              text = text.replace(append_marker, append_replacement, 1)
          registry.write_text(text)

          init = Path('codex_wire_audit/extractors/__init__.py')
          text = init.read_text()
          if '"app_server_rpc"' not in text:
              marker = '    "responses_protocol",\n)'
              if marker not in text:
                  raise SystemExit('extractor activation marker missing')
              text = text.replace(marker, '    "responses_protocol",\n    "app_server_rpc",\n)', 1)
          init.write_text(text)

          profiles_path = Path('codex_wire_audit/coverage_profiles.v3.json')
          doc = json.loads(profiles_path.read_text())
          by_id = {row['id']: row for row in doc['profiles']}
          extractor_id = 'extractor.app_server_rpc'
          if extractor_id not in by_id['codex_wire_full']['required_extractors']:
              raise SystemExit('codex_wire_full lost declared app-server extractor')
          hybrid = by_id['hybrid_v19']
          if extractor_id not in hybrid['required_extractors']:
              hybrid['required_extractors'].append(extractor_id)
          hybrid['description'] = (
              'Transition profile: canonical generated config schema, config-to-surface graph, turn metadata, '
              'context management, prompt/context composition, execution authority, plugin runtime capabilities, '
              'execution-environment context, routing/proxy transport and redirect/header replay, MCP tool projection, '
              'Responses request/Lite/event semantics, and app-server RPC/thread-turn lifecycle; remaining protocol '
              'families may still use the frozen legacy adapter.'
          )
          if 'app_server_rpc_only' not in by_id:
              profile = {
                  'allow_legacy_reconstruction': False,
                  'description': (
                      'Focused source-derived app-server RPC and thread/turn/item lifecycle proof without claiming '
                      'local persistence, Responses transport, permission authority, or multi-agent execution internals.'
                  ),
                  'id': 'app_server_rpc_only',
                  'required_dimensions': ['schema', 'profile', 'provenance'],
                  'required_extractors': [extractor_id],
                  'required_history_keys': [],
                  'required_runtime_scenarios': [],
                  'version': '1.0.0',
              }
              idx = next(i for i, row in enumerate(doc['profiles']) if row['id'] == 'fixture')
              doc['profiles'].insert(idx, profile)
          profiles_path.write_text(json.dumps(doc, indent=2) + '\n')

          release_path = Path('codex_wire_audit/release_spec.v1.json')
          release = json.loads(release_path.read_text())
          claims = release['capability_claims']
          if not any(row['id'] == 'app_server_rpc' for row in claims):
              claim = {
                  'extractor_ids': [extractor_id],
                  'id': 'app_server_rpc',
                  'profile_assertions': {
                      'app_server_rpc_only': {'required_extractors_contains': [extractor_id]},
                      'codex_wire_full': {'required_extractors_contains': [extractor_id]},
                      'hybrid_v19': {'required_extractors_contains': [extractor_id]},
                  },
                  'required_resources': [
                      'extractors/app_server_rpc.py',
                      'proof_schema_templates/app-server-rpc-lifecycle-v1.schema.json',
                      'coverage_profiles.v3.json',
                  ],
                  'status': 'active_package',
              }
              claims.insert(next(i for i, row in enumerate(claims) if row['id'] == 'canonical_system_contract'), claim)
          canonical = next(row for row in claims if row['id'] == 'canonical_system_contract')
          required = canonical['profile_assertions']['hybrid_v19']['required_extractors_contains']
          if extractor_id not in required:
              required.append(extractor_id)
          release_path.write_text(json.dumps(release, indent=2) + '\n')
          PY
          python -m pytest -q tests/test_app_server_rpc_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
      - name: Commit deterministic app-server outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/extractors/app_server_rpc.py \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(app-server): wire RPC lifecycle and refresh deterministic evidence'
          git push origin HEAD:contract/app-server/feat/rpc-lifecycle
