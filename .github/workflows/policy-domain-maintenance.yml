name: policy-domain-maintenance

on:
  push:
    branches:
      - contract/policy/feat/execution-authority
    paths:
      - .github/workflows/policy-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire execution-policy domain at exact markers
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          registry = 'toolchain/codex_wire_audit/source_registry.py'
          generated_marker = '''    specs.append(SourceSpec(
              id="source_spec.extra.generated_config_schema",'''
          policy_specs = '''    policy_specs = (
              ("source_spec.extra.policy_protocol", "policy_protocol", "codex-rs/protocol/src/models.rs", ("pub enum PermissionProfile", "pub enum SandboxEnforcement", "pub struct ActivePermissionProfile")),
              ("source_spec.extra.policy_permissions", "policy_permissions", "codex-rs/core/src/config/permissions.rs", ("default_builtin_permission_profile_name", "compile_permission_profile_selection", "resolve_permission_profile")),
              ("source_spec.extra.policy_requirements", "policy_requirements", "codex-rs/config/src/config_requirements.rs", ("pub struct ConfigRequirements", "pub approval_policy", "pub permission_profile")),
              ("source_spec.extra.policy_config_resolution", "policy_config_resolution", "codex-rs/core/src/config/mod.rs", ("resolve_effective_permission_selection", "resolve_default_permissions", "allowed_permission_profiles")),
              ("source_spec.extra.policy_profile_state", "policy_profile_state", "codex-rs/core/src/config/resolved_permission_profile.rs", ("PermissionProfileState", "active_permission_profile", "profile_workspace_roots")),
              ("source_spec.extra.policy_turn_context", "policy_turn_context", "codex-rs/core/src/session/turn_context.rs", ("fn approval_policy", "fn permission_profile", "fn allow_prefix_rules")),
              ("source_spec.extra.policy_exec_policy", "policy_exec_policy", "codex-rs/core/src/exec_policy.rs", ("ExecApprovalRequest", "prompt_is_rejected_by_policy", "Decision::Forbidden")),
          )
'''
          replace_once(registry, generated_marker, policy_specs + generated_marker)
          prompt_tail = '''    existing_ids = {spec.id for spec in specs}
              for spec_id, legacy_key, path, symbols in prompt_specs:
                  if spec_id in existing_ids:
                      continue
                  specs.append(SourceSpec(
                      id=spec_id,
                      legacy_key=legacy_key,
                      group=SourceGroup.EXTRA,
                      path_candidates=(path,),
                      required=False,
                      roles=("prompt_context",),
                      expected_symbols=tuple(symbols),
                      extractor_ids=("extractor.prompt_context",),
                  ))
              return SourceRegistry(specs)'''
          policy_tail = '''    existing_ids = {spec.id for spec in specs}
              for spec_id, legacy_key, path, symbols in prompt_specs:
                  if spec_id in existing_ids:
                      continue
                  specs.append(SourceSpec(
                      id=spec_id,
                      legacy_key=legacy_key,
                      group=SourceGroup.EXTRA,
                      path_candidates=(path,),
                      required=False,
                      roles=("prompt_context",),
                      expected_symbols=tuple(symbols),
                      extractor_ids=("extractor.prompt_context",),
                  ))
              existing_ids = {spec.id for spec in specs}
              for spec_id, legacy_key, path, symbols in policy_specs:
                  if spec_id in existing_ids:
                      continue
                  specs.append(SourceSpec(
                      id=spec_id,
                      legacy_key=legacy_key,
                      group=SourceGroup.EXTRA,
                      path_candidates=(path,),
                      required=False,
                      roles=("execution_policy",),
                      expected_symbols=tuple(symbols),
                      extractor_ids=("extractor.execution_policy",),
                  ))
              return SourceRegistry(specs)'''
          replace_once(registry, prompt_tail, policy_tail)

          init = 'toolchain/codex_wire_audit/extractors/__init__.py'
          replace_once(
              init,
              'from . import prompt_context as _prompt_context  # noqa: E402,F401\n',
              'from . import prompt_context as _prompt_context  # noqa: E402,F401\nfrom . import execution_policy as _execution_policy  # noqa: E402,F401\n',
          )

          profiles = 'toolchain/codex_wire_audit/coverage_profiles.v3.json'
          replace_once(
              profiles,
              'Transition profile: canonical generated config schema, config-to-surface graph, turn metadata, context management, and prompt/context composition; remaining protocol families may still use the frozen legacy adapter.',
              'Transition profile: canonical generated config schema, config-to-surface graph, turn metadata, context management, prompt/context composition, and execution authority; remaining protocol families may still use the frozen legacy adapter.',
          )
          replace_once(
              profiles,
              '        "extractor.config_effects",\n        "extractor.prompt_context"\n      ],',
              '        "extractor.config_effects",\n        "extractor.prompt_context",\n        "extractor.execution_policy"\n      ],',
          )
          replace_once(
              profiles,
              'Repository-wide canonical wire, local-storage, and prompt-context proof. Legacy reconstruction cannot satisfy it, and historical metadata transitions and runtime conformance are part of the proof surface.',
              'Repository-wide canonical wire, local-storage, prompt-context, and execution-policy proof. Legacy reconstruction cannot satisfy it, and historical metadata transitions and runtime conformance are part of the proof surface.',
          )
          replace_once(
              profiles,
              '        "extractor.context_management",\n        "extractor.prompt_context"\n      ],',
              '        "extractor.context_management",\n        "extractor.prompt_context",\n        "extractor.execution_policy"\n      ],',
          )
          fixture_marker = '''    {
              "allow_legacy_reconstruction": true,
              "description": "Deterministic unit/integration fixture profile.",'''
          policy_profile = '''    {
              "allow_legacy_reconstruction": false,
              "description": "Focused source-derived execution authority proof without claiming prompt rendering, environment construction, plugin/MCP runtime, or proxy routing semantics.",
              "id": "execution_policy_only",
              "required_dimensions": [
                "schema",
                "profile",
                "provenance"
              ],
              "required_extractors": [
                "extractor.execution_policy"
              ],
              "required_history_keys": [],
              "required_runtime_scenarios": [],
              "version": "1.0.0"
            },
'''
          replace_once(profiles, fixture_marker, policy_profile + fixture_marker)

          release_spec = 'toolchain/codex_wire_audit/release_spec.v1.json'
          canonical_marker = '''    {
              "extractor_ids": [],
              "id": "canonical_system_contract",'''
          capability = '''    {
              "extractor_ids": [
                "extractor.execution_policy"
              ],
              "id": "execution_policy",
              "profile_assertions": {
                "codex_wire_full": {
                  "required_extractors_contains": [
                    "extractor.execution_policy"
                  ]
                },
                "execution_policy_only": {
                  "required_extractors_contains": [
                    "extractor.execution_policy"
                  ]
                },
                "hybrid_v19": {
                  "required_extractors_contains": [
                    "extractor.execution_policy"
                  ]
                }
              },
              "required_resources": [
                "extractors/execution_policy.py",
                "proof_schema_templates/execution-policy-semantics-v1.schema.json",
                "coverage_profiles.v3.json"
              ],
              "status": "active_package"
            },
'''
          replace_once(release_spec, canonical_marker, capability + canonical_marker)
          replace_once(
              release_spec,
              '            "extractor.config_effects",\n            "extractor.prompt_context"\n          ]',
              '            "extractor.config_effects",\n            "extractor.prompt_context",\n            "extractor.execution_policy"\n          ]',
          )
          PY
      - name: Validate policy domain and regenerate deterministic assets
        working-directory: toolchain
        run: |
          python -m pytest -q tests/test_execution_policy_extractor.py
          make legacy-assets
          python tools/maintainability_metrics.py --write
      - name: Commit domain wiring and deterministic evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat(policy): wire execution authority into contract proof'
          git push origin HEAD:contract/policy/feat/execution-authority
