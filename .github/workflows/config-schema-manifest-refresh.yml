name: config-schema-manifest-refresh

on:
  push:
    branches:
      - contract/config/feat/native-effect-closure
    paths:
      - .github/workflows/config-schema-manifest-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate and verify v11 assets
        working-directory: toolchain
        run: |
          set -euo pipefail
          make legacy-assets
          make check-legacy-assets
      - name: Commit deterministic manifest closure
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- toolchain/codex_wire_audit_v11_schemas toolchain/codex_wire_audit_v11_examples
          git diff --cached --quiet && exit 0
          git commit -m 'chore(config): refresh v11 schema manifest'
          git push origin HEAD:contract/config/feat/native-effect-closure
