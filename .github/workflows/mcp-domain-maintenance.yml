name: mcp-domain-maintenance

on:
  push:
    branches:
      - contract/mcp/feat/tool-projection
    paths:
      - .github/workflows/mcp-domain-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Wire MCP projection domain
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          registry = Path('codex_wire_audit/source_registry.py')
          text = registry.read_text()
          insert_before = '''    specs.append(SourceSpec(\n        id="source_spec.extra.generated_config_schema",'''
          mcp_block = '''    mcp_specs = (\n        ("source_spec.extra.mcp_catalog", "mcp_catalog", "codex-rs/codex-mcp/src/catalog.rs", ("McpServerSource", "McpCatalogBuilder", "ResolvedMcpCatalog")),\n        ("source_spec.extra.mcp_runtime", "mcp_runtime", "codex-rs/codex-mcp/src/mcp/mod.rs", ("McpConfig", "effective_mcp_servers", "ToolPluginProvenance")),\n        ("source_spec.extra.mcp_tools", "mcp_tools", "codex-rs/codex-mcp/src/tools.rs", ("ToolInfo", "ToolFilter", "normalize_tools_for_model_with_prefix")),\n        ("source_spec.extra.mcp_tool_exposure", "mcp_tool_exposure", "codex-rs/core/src/mcp_tool_exposure.rs", ("McpHandlerCache", "append_mcp_tools", "tool_is_model_visible")),\n        ("source_spec.extra.mcp_tool_plan", "mcp_tool_plan", "codex-rs/core/src/tools/spec_plan.rs", ("build_tool_router", "apply_mcp_tool_exposure_policy", "omit_tools_from")),\n        ("source_spec.extra.mcp_handler", "mcp_handler", "codex-rs/core/src/tools/handlers/mcp.rs", ("McpHandler", "prepare_mcp_call", "handle_mcp_tool_call")),\n    )\n'''
          if 'mcp_specs = (' not in text:
              if insert_before not in text:
                  raise SystemExit('source registry insertion marker missing')
              text = text.replace(insert_before, mcp_block + insert_before, 1)
          append_marker = '''    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    return SourceRegistry(specs)'''
          append_replacement = '''    _append_optional_specs(\n        specs,\n        routing_specs,\n        role="routing_transport",\n        extractor_id="extractor.routing_transport",\n    )\n    _append_optional_specs(\n        specs,\n        mcp_specs,\n        role="mcp_projection",\n        extractor_id="extractor.mcp_projection",\n    )\n    return SourceRegistry(specs)'''
          if 'role="mcp_projection"' not in text:
              if append_marker not in text:
                  raise SystemExit('source registry append marker missing')
              text = text.replace(append_marker, append_replacement, 1)
          registry.write_text(text)

          init = Path('codex_wire_audit/extractors/__init__.py')
          text = init.read_text()
          marker = 'from . import routing_transport as _routing_transport  # noqa: E402,F401\n'
          if '_mcp_projection' not in text:
              if marker not in text:
                  raise SystemExit('extractor import marker missing')
              text = text.replace(marker, marker + 'from . import mcp_projection as _mcp_projection  # noqa: E402,F401\n', 1)
          init.write_text(text)

          profiles_path = Path('codex_wire_audit/coverage_profiles.v3.json')
          doc = json.loads(profiles_path.read_text())
          by_id = {row['id']: row for row in doc['profiles']}
          values = by_id['hybrid_v19']['required_extractors']
          if 'extractor.mcp_projection' not in values:
              values.append('extractor.mcp_projection')
          by_id['hybrid_v19']['description'] = (
              'Transition profile: canonical generated config schema, config-to-surface graph, turn metadata, '
              'context management, prompt/context composition, execution authority, plugin runtime capabilities, '
              'execution-environment context, routing/proxy transport, and MCP tool projection; remaining protocol '
              'families may still use the frozen legacy adapter.'
          )
          # mcp_only and codex_wire_full already declare extractor.mcp_projection; preserve them.
          profiles_path.write_text(json.dumps(doc, indent=2) + '\n')

          release_path = Path('codex_wire_audit/release_spec.v1.json')
          release = json.loads(release_path.read_text())
          claims = release['capability_claims']
          if not any(row['id'] == 'mcp_projection' for row in claims):
              claim = {
                  'extractor_ids': ['extractor.mcp_projection'],
                  'id': 'mcp_projection',
                  'profile_assertions': {
                      'codex_wire_full': {'required_extractors_contains': ['extractor.mcp_projection']},
                      'hybrid_v19': {'required_extractors_contains': ['extractor.mcp_projection']},
                      'mcp_only': {'required_extractors_contains': ['extractor.mcp_projection']},
                  },
                  'required_resources': [
                      'extractors/mcp_projection.py',
                      'proof_schema_templates/mcp-projection-semantics-v1.schema.json',
                      'coverage_profiles.v3.json',
                  ],
                  'status': 'active_package',
              }
              idx = next(i for i, row in enumerate(claims) if row['id'] == 'canonical_system_contract')
              claims.insert(idx, claim)
          canonical = next(row for row in claims if row['id'] == 'canonical_system_contract')
          required = canonical['profile_assertions']['hybrid_v19']['required_extractors_contains']
          if 'extractor.mcp_projection' not in required:
              required.append('extractor.mcp_projection')
          release_path.write_text(json.dumps(release, indent=2) + '\n')
          PY
          python -m pytest -q tests/test_mcp_projection_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
      - name: Commit deterministic MCP outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/source_registry.py \
            toolchain/codex_wire_audit/extractors/__init__.py \
            toolchain/codex_wire_audit/coverage_profiles.v3.json \
            toolchain/codex_wire_audit/release_spec.v1.json \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(mcp): refresh registry and package evidence'
          git push origin HEAD:contract/mcp/feat/tool-projection
