name: refresh-cookie-metrics

on:
  push:
    branches:
      - fix/responses-websocket-cookie-affinity
    paths:
      - "toolchain/codex_wire_audit/extractors/responses_protocol.py"
      - ".github/workflows/_refresh_cookie_metrics.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/responses-websocket-cookie-affinity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Refresh maintainability metrics
        working-directory: toolchain
        run: python tools/maintainability_metrics.py --write
      - name: Commit metrics
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md toolchain/codex_wire_audit_v19_maintainability_metrics.json
          git commit -m "chore: refresh maintainability metrics"
          git push origin HEAD:fix/responses-websocket-cookie-affinity
