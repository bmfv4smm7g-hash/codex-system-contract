name: branch-proof-hardening-build

on:
  push:
    branches: ["fix/codex-proof-hardening-v2"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-proof-hardening-build
  cancel-in-progress: true

jobs:
  prepare-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Apply proof-hardening source patch
        run: python toolchain/tools/prepare_proof_hardening.py
      - name: Install constrained package
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate deterministic assets
        working-directory: toolchain
        run: make assets
      - name: Run source, schema, asset, and contract checks
        working-directory: toolchain
        run: |
          set -euo pipefail
          make compile
          python -m pytest -q
          make check-assets
          python tools/check_canonical_contract.py
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/source-capabilities.json"
      - name: Prove pinned and current Codex sources
        run: |
          set -euo pipefail
          pinned="$RUNNER_TEMP/codex-pinned"
          current="$RUNNER_TEMP/codex-current"
          proof="$RUNNER_TEMP/source-proof"
          mkdir -p "$proof"
          git clone --filter=blob:none --no-checkout https://github.com/openai/codex.git "$pinned"
          git -C "$pinned" fetch --depth=1 origin 6af345407d9c2a568da9d01b6c4b81a9e61495c0
          git -C "$pinned" checkout --detach FETCH_HEAD
          git clone --depth=1 https://github.com/openai/codex.git "$current"
          codex-wire-audit --json --repo-root "$pinned" --coverage-profile hybrid_v19 \
            --fail-on incomplete --emit-system-contract "$proof/pinned-system-contract.json" \
            --output "$proof/pinned-report.json"
          codex-wire-audit --json --repo-root "$current" --coverage-profile current_main_static_full \
            --fail-on incomplete --emit-system-contract "$proof/current-system-contract.json" \
            --output "$proof/current-report.json"
          git -C "$current" rev-parse HEAD | tee "$proof/current-codex-head.txt"
      - name: Collect generated patch
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/proof-hardening-generated"
          mkdir -p "$out"
          while IFS= read -r -d '' file; do
            mkdir -p "$out/$(dirname "$file")"
            cp "$file" "$out/$file"
          done < <({ git diff --name-only -z; git ls-files --others --exclude-standard -z; })
          git status --short > "$out/generated-files.txt"
      - name: Upload generated patch and proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-hardening-generated
          path: |
            ${{ runner.temp }}/proof-hardening-generated
            ${{ runner.temp }}/source-proof
            ${{ runner.temp }}/source-capabilities.json
          if-no-files-found: warn
          retention-days: 14
