name: temporary-report-integrity-fix-20260915

on:
  push:
    branches:
      - system-contract/fix/direct-authority
    paths:
      - .github/workflows/temporary-report-integrity-fix-20260915.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-report-integrity-fix-20260915
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Record immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'system-contract/fix/direct-authority'
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Install constrained development dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'

      - name: Materialize integrity provenance repair
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/fix-report-integrity.py
          python .github/fix-report-integrity.py
          rm -f .github/fix-report-integrity.py

      - name: Regenerate deterministic assets
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          if python tools/check_canonical_contract.py --help 2>&1 | grep -q -- '--write-assets'; then
            python tools/check_canonical_contract.py --write-assets
          fi
          python tools/maintainability_metrics.py --write

      - name: Prove source and release closure
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integrity-proof"
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/integrity-proof/pytest.txt"
          make check-assets | tee "$RUNNER_TEMP/integrity-proof/assets.txt"
          python tools/maintainability_metrics.py --check | tee "$RUNNER_TEMP/integrity-proof/maintainability.txt"
          python tools/check_canonical_contract.py --output "$RUNNER_TEMP/integrity-proof/canonical.json"
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/integrity-proof/source-capabilities.json"
          python tools/release_pipeline.py release --output-dir "$RUNNER_TEMP/integrity-release" | tee "$RUNNER_TEMP/integrity-proof/release.json"
          python tools/release_pipeline.py verify --release-dir "$RUNNER_TEMP/integrity-release" | tee "$RUNNER_TEMP/integrity-proof/release-verify.json"

      - name: Validate pinned Codex integration
        shell: bash
        env:
          PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$RUNNER_TEMP/integrity-proof/pinned-integration.json" \
            --schema-output "$RUNNER_TEMP/integrity-proof/config-schema.json" \
            --graph-output "$RUNNER_TEMP/integrity-proof/config-surface-graph.json"

      - name: Publish only the proved repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-report-integrity-fix-20260915.yml
          git add -A
          git diff --cached --check
          tested_tree="$(git write-tree)"
          test -n "$tested_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(system-contract): preserve sealed report provenance'
          git fetch --no-tags origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$START_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf '{"start":"%s","commit":"%s","tree":"%s","force":false}\n' \
            "$START_SHA" "$(git rev-parse HEAD)" "$tested_tree" \
            > "$RUNNER_TEMP/integrity-proof/publication.json"

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-integrity-repair-proof
          path: ${{ runner.temp }}/integrity-proof
          if-no-files-found: warn
          retention-days: 30
