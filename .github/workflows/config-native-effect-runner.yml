name: config-native-effect-runner

on:
  push:
    branches:
      - contract/config/feat/native-effect-closure
    paths:
      - .github/workflows/config-native-effect-runner.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Execute corrected closure patch and proof
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/config-native-effect-closure.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          block_start = script.index('for name in (')
          block_end = script.index('\n    path = Path(name)', block_start)
          block = script[block_start:block_end].replace('\\n', '\n')
          script = script[:block_start] + block + script[block_end:]
          Path('/tmp/config-native-effect-closure.py').write_text(script)
          PY
          cd toolchain
          python /tmp/config-native-effect-closure.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_config_surface_v19.py')
          text = path.read_text()
          old = '        spec=core.spec,\n'
          new = '        spec=_registry().get(SOURCE_IDS["core_config"]),\n'
          if old not in text:
              raise SystemExit('negative source-anchor fixture marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('codex_wire_audit/extractors/config_effects.py')
          text = path.read_text()
          class_pos = text.index('\n\nclass ConfigEffectsExtractor:')
          extract_pos = text.index('    def extract(', class_pos)
          start = text.index('        complete = True\n', extract_pos)
          end = text.index('        data: dict[str, Any] = {', start)
          body = textwrap.dedent(text[start:end])
          helper = '''def _validate_semantics(
              diagnostics: DiagnosticCollector,
              *,
              catalog: dict[str, Any],
              registry: dict[str, Any],
              schema_policy: dict[str, Any],
              crosswalk: dict[str, Any],
              missing_effect_paths: list[str],
              missing_effect_anchors: list[dict[str, str]],
              missing_legacy: list[str],
              effect_sources: dict[str, SourceFile | None],
              schema_source: SourceFile,
              registry_source: SourceFile,
              schema_generator_source: SourceFile,
          ) -> bool:
          '''
          helper = textwrap.dedent(helper) + textwrap.indent(body, '    ') + '    return complete\n'
          call = '''        complete = _validate_semantics(
              diagnostics,
              catalog=catalog,
              registry=registry,
              schema_policy=schema_policy,
              crosswalk=crosswalk,
              missing_effect_paths=missing_effect_paths,
              missing_effect_anchors=missing_effect_anchors,
              missing_legacy=missing_legacy,
              effect_sources=effect_sources,
              schema_source=schema_source,
              registry_source=registry_source,
              schema_generator_source=schema_generator_source,
          )

          '''
          call = textwrap.dedent(call)
          text = text[:start] + call + text[end:]
          class_pos = text.index('\n\nclass ConfigEffectsExtractor:')
          text = text[:class_pos] + '\n\n' + helper + text[class_pos:]
          path.write_text(text)
          PY
          python -m pytest -q tests/test_config_surface_v19.py test_codex_wire_audit_v11.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          python -m pytest -q tests/test_release_pipeline_v18.py::test_release_pipeline_is_series_driven_and_tooling_is_budgeted
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit canonical config closure
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            toolchain/codex_wire_audit/config_effect_specs.py \
            toolchain/codex_wire_audit/extractors/config_effects.py \
            toolchain/codex_wire_audit/surface_graph.py \
            toolchain/codex_wire_audit/evolution.py \
            toolchain/codex_wire_audit/orchestrator.py \
            toolchain/codex_wire_audit/schema_templates/evolution-contract.schema.json \
            toolchain/codex_wire_audit_v11_schemas/evolution-contract.schema.json \
            contracts/codex-system-contract/v1/schema.json \
            toolchain/tests/test_config_surface_v19.py \
            toolchain/test_codex_wire_audit_v11.py \
            toolchain/codex_wire_audit_v11_examples \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat(config): close native effect graph and retire model reconstruction'
          git push origin HEAD:contract/config/feat/native-effect-closure
